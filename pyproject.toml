[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nps"
version = "0.1.0"
description = "Slicer no planar basado en PrusaSlicer, optimizado para velocidad y resistencia homogénea"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nps = "nps.cli:main"

[tool.setuptools.packages.find]
include = ["nps*"]

[tool.setuptools.package-data]
nps = ["*.ini", "profiles/*.ini"]
