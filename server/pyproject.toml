[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tisma-cloud"
version = "0.1.0"
description = "Tisma Cloud: master server and computing nodes for Tisma Slicer"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The master server: API, queue and database.
master = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
]
# A computing node needs only httpx (and the Tisma programs).
node = []
test = ["pytest>=8"]

[project.scripts]
tisma-cloud-admin = "tisma_cloud.admin:main"
tisma-cloud-node = "tisma_cloud.node.__main__:main"

[tool.setuptools.packages.find]
include = ["tisma_cloud*"]

[tool.setuptools.package-data]
tisma_cloud = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
