# The master machine: HTTPS proxy, API and database. Run: docker compose --env-file .env -f deploy/compose.master.yaml up -d
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      TISMA_DOMAIN: ${TISMA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.master }
    restart: unless-stopped
    env_file: ../.env
    environment:
      TISMA_DATABASE_URL: postgresql+psycopg://tisma:${POSTGRES_PASSWORD}@db:5432/tisma
    volumes: ["storage:/data"]
    # Port 8000 only for the nodes of the local network: do not forward it in the router.
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tisma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tisma
    volumes: ["db:/var/lib/postgresql/data"]
  # Daily copy of the database (accounts, payments) with rotation: backup.sh. BACKUP_DIR on the host should be another
  # disk, or be copied to another machine (README, "Copias de seguridad").
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: tisma
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tisma
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_DAYS: ${BACKUP_DAYS:-14}
      BACKUP_WEEKS: ${BACKUP_WEEKS:-8}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./restore.sh:/usr/local/bin/restore.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on: [db]
volumes:
  caddy-data:
  storage:
  db:
