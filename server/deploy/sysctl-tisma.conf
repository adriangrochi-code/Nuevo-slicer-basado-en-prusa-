# Kernel settings of the master against floods of connections (sudo cp to /etc/sysctl.d/90-tisma.conf; sudo sysctl --system).
# SYN cookies: half-open connections (SYN flood) do not fill the queue.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_synack_retries = 2
# Spoofed source addresses are dropped.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# No ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
