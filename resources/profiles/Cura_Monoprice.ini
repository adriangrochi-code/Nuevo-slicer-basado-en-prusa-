[printer:Monoprice Ultimate 0.4 nozzle]
inherits = *common @Cura_Monoprice*
printer_model = Monoprice Ultimate
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_MONOPRICE\nCURA_DEFINITION_monoprice_ultimate
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 180
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = G21 ;metric values\n G90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\n M107 ;start with the fan off\n G28 X0 Y0 ;move X/Y to min endstops\n G28 Z0 ;move Z to min endstops\n G1 Z15.0 F[travel_speed] ;move the platform down 15mm\n G92 E0 ;zero the extruded length\n G1 F200 E6 ;extrude 6 mm of feed stock\n G92 E0 ;zero the extruded length again\n G1 F[travel_speed] \n ;Put printing message on LCD screen\n M117 Printing...
end_gcode = M104 S0 ;extruder heater off \n G91 ;relative positioning\n G1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure\n G1 Z+0.5 E-5 X-20 Y-20 F[travel_speed] ;move Z up a bit and retract filament even more\n G28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\n M84 ;steppers off\n G90 ;absolute positioning
default_print_profile = 0.20mm Standard @Cura Monoprice 0.4
default_filament_profile = Generic PLA @Orca
