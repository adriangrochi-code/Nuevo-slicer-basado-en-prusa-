[vendor]
repo_id = non-prusa-fff
name = Monoprice
config_version = 1.0.0
config_update_url = 

[printer_model:Monoprice Select Mini V1]
name = Monoprice Select Mini V1
variants = 0.4
technology = FFF
family = Monoprice
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[printer_model:Monoprice Select Mini V2 (E3D)]
name = Monoprice Select Mini V2 (E3D)
variants = 0.4
technology = FFF
family = Monoprice
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[printer_model:Monoprice Ultimate]
name = Monoprice Ultimate
variants = 0.4
technology = FFF
family = Monoprice
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_Monoprice*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Monoprice 0.4]
inherits = *common @Cura_Monoprice*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_MONOPRICE.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Monoprice 0.4]
inherits = *common @Cura_Monoprice*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_MONOPRICE.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Monoprice 0.4]
inherits = *common @Cura_Monoprice*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_MONOPRICE.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Monoprice*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Monoprice Select Mini V1 0.4 nozzle]
inherits = *common @Cura_Monoprice*
printer_model = Monoprice Select Mini V1
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_MONOPRICE\nCURA_DEFINITION_monoprice_select_mini_v1
bed_shape = 0x0,120x0,120x120,0x120
max_print_height = 120
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 4.5
retract_speed = 40
start_gcode = G21;(metric values)\nG90;(absolute positioning)\nM83 ; relative extrusion (Tisma)\nM107;(start with the fan off)\nG28;(Home the printer)\nG92 E0;(Reset the extruder to 0)\nG0 Z5 E5 F500;(Move up and prime the nozzle)\nG0 X-1 Z0;(Move outside the printable area)\nG1 Y60 E8 F500;(Draw a priming/wiping line to the rear)\nG1 X-1;(Move a little closer to the print area)\nG1 Y10 E16 F500;(draw more priming/wiping)\nG1 E15 F250;(Small retract)\nG92 E0;(Zero the extruder)
end_gcode = G0 X0 Y120;(Stick out the part)\nM190 S0;(Turn off heat bed, don't wait.)\nG92 E10;(Set extruder to 10)\nG1 E7 F200;(retract 3mm)\nM104 S0;(Turn off nozzle, don't wait)\nG4 S300;(Delay 5 minutes)\nM107;(Turn off part fan)\nM84;(Turn off stepper motors.)
default_print_profile = 0.20mm Standard @Cura Monoprice 0.4
default_filament_profile = Generic PLA @Orca

[printer:Monoprice Select Mini V2 (E3D) 0.4 nozzle]
inherits = *common @Cura_Monoprice*
printer_model = Monoprice Select Mini V2 (E3D)
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_MONOPRICE\nCURA_DEFINITION_monoprice_select_mini_v2
bed_shape = 0x0,120x0,120x120,0x120
max_print_height = 120
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 2.5
retract_speed = 40
start_gcode = G21;(metric values)\nG90;(absolute positioning)\nM83 ; relative extrusion (Tisma)\nM107;(start with the fan off)\nG28;(Home the printer)\nG92 E0;(Reset the extruder to 0)\nG0 Z5 E5 F500;(Move up and prime the nozzle)\nG0 X-1 Z0;(Move outside the printable area)\nG1 Y60 E8 F500;(Draw a priming/wiping line to the rear)\nG1 X-1;(Move a little closer to the print area)\nG1 Y10 E16 F500;(draw more priming/wiping)\nG1 E15 F250;(Small retract)\nG92 E0;(Zero the extruder)
end_gcode = G0 X0 Y120;(Stick out the part)\nM190 S0;(Turn off heat bed, don't wait.)\nG92 E10;(Set extruder to 10)\nG1 E7 F200;(retract 3mm)\nM104 S0;(Turn off nozzle, don't wait)\nG4 S300;(Delay 5 minutes)\nM107;(Turn off part fan)\nM84;(Turn off stepper motors.)
default_print_profile = 0.20mm Standard @Cura Monoprice 0.4
