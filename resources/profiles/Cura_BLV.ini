[printer_model:BLV MGN Cube 300]
name = BLV MGN Cube 300
variants = 0.4
technology = FFF
family = BLV
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[printer_model:BLV MGN Cube 350]
name = BLV MGN Cube 350
variants = 0.4
technology = FFF
family = BLV
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_BLV*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura BLV 0.4]
inherits = *common @Cura_BLV*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_BLV.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura BLV 0.4]
inherits = *common @Cura_BLV*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_BLV.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura BLV 0.4]
inherits = *common @Cura_BLV*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_BLV.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_BLV*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:BLV MGN Cube 300 0.4 nozzle]
inherits = *common @Cura_BLV*
printer_model = BLV MGN Cube 300
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_BLV\nCURA_DEFINITION_blv_mgn_cube_300
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 465
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = reprapfirmware
retract_length = 5.5
retract_speed = 85
