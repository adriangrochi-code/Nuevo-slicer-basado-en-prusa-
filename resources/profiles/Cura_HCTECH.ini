brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura HCTECH 0.4]
inherits = *common @Cura_HCTECH*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_HCTECH.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura HCTECH 0.4]
inherits = *common @Cura_HCTECH*
