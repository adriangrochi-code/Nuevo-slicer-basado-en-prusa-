start_gcode = ; === IdeaFormer IR3 V2 Belt Printer Start ===\n; Axes: X=lateral, Y=gantry height (probe), Z=belt\nG90 ; absolute positioning\nM82 ; absolute extruder\nG21 ; millimeters\nG28 ; home all axes\nG1 Y20 F500 ; lift nozzle 20mm from belt\n; Bed + hotend temps come from the active filament profile. Belt PLA requires 75 C bed — use Generic/eSun PLA @IdeaFormer IR3 V2 filament presets to get it automatically.\nM140 S[first_layer_bed_temperature] ; set bed temp\nM104 S[first_layer_temperature] ; hotend temp\nM109 S[first_layer_temperature] ; wait hotend\nM190 S[first_layer_bed_temperature] ; wait bed\n; --- Purge blob ---\nG92 E0 ; zero extruder\nG1 Y.1 ; nozzle 0.1mm above belt\nG1 E15 F1000 ; purge 15mm blob\nG1 Z20 E25 F800 ; belt advance 20mm + extrude\nG1 E23 ; retract 2mm\nG28 Y ; re-probe belt surface\nG1 E25 ; de-retract\n; --- Prime lines (full 250mm bed width) ---\nFMS_on ; filament motion sensor\nG1 X250 E50 F2000 ; prime line 1\nG92 Z0 ; reset belt origin\nG1 Z.4 ; belt advance 0.4mm\nG1 X0 E75 ; prime line 2\nG1 F1000 ; default feedrate\nG92 E0 Z0 ; zero extruder + belt = print origin\n
end_gcode = ; === IdeaFormer IR3 V2 Belt Printer End ===\nM400 ; wait for moves to finish\nG28 X ; home X axis\nM104 S0 ; heater off\nM140 S0 ; bed off\nG92 E0 ; zero extruder\nG1 E-5 F300 ; retract 5mm\nG4 P7000 ; wait 7s for ooze\nG28 ; home all\nG1 Y50 F1000 ; lift nozzle 50mm\nFMS_off ; filament motion sensor off\nBED_MESH_CLEAR\nM84 ; disable motors\n
default_print_profile = 0.20mm Standard @IdeaFormer IR3 V2
default_filament_profile = Generic PLA @IdeaFormer IR3 V2
