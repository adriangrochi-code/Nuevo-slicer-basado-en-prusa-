external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Snapmaker 0.4]
inherits = *common @Cura_Snapmaker*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_SNAPMAKER.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Snapmaker 0.4]
inherits = *common @Cura_Snapmaker*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_SNAPMAKER.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Snapmaker 0.4]
inherits = *common @Cura_Snapmaker*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_SNAPMAKER.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Snapmaker*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Snapmaker 2 A150 0.4 nozzle]
inherits = *common @Cura_Snapmaker*
printer_model = Snapmaker 2 A150
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_SNAPMAKER\nCURA_DEFINITION_snapmaker2_A150
bed_shape = 0x0,160x0,160x160,0x160
max_print_height = 145
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 5
retract_speed = 60
start_gcode = M104 S[first_layer_temperature] ;Set Hotend Temperature\nM140 S[first_layer_bed_temperature] ;Set Bed Temperature\nG28 ;home\nG90 ;absolute positioning\nG1 X-10 Y-10 F3000 ;Move to corner \nG1 Z0 F1800 ;Go to zero offset\nM109 S[first_layer_temperature] ;Wait for Hotend Temperature\nM190 S[first_layer_bed_temperature] ;Wait for Bed Temperature\nG92 E0 ;Zero set extruder position\nG1 E20 F200 ;Feed filament to clear nozzle\nG92 E0 ;Zero set extruder position
end_gcode = M104 S0 ;Extruder heater off\nM140 S0 ;Heated bed heater off\nG90 ;absolute positioning\nG92 E0 ;Retract the filament\nG1 E-1 F300 ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z145 E-1 F3000 ;move Z up a bit and retract filament even more\nG1 X0 F3000 ;move X to min endstops, so the head is out of the way\nG1 Y160 F3000 ;so the head is out of the way and Plate is moved forward
default_print_profile = 0.20mm Standard @Cura Snapmaker 0.4
default_filament_profile = Generic PLA @Orca @Template
