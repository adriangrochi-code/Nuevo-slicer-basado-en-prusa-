[vendor]
repo_id = non-prusa-fff
name = tank_m
config_version = 1.0.1
config_update_url = 

[printer_model:Tank M3 Max]
name = Tank M3 Max
variants = 0.4
technology = FFF
family = tank_m
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_tank_m*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura tank m 0.4]
inherits = *common @Cura_tank_m*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_TANK_M.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura tank m 0.4]
inherits = *common @Cura_tank_m*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_TANK_M.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura tank m 0.4]
inherits = *common @Cura_tank_m*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_TANK_M.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_tank_m*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Tank M3 Max 0.4 nozzle]
inherits = *common @Cura_tank_m*
printer_model = Tank M3 Max
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_TANK_M\nCURA_DEFINITION_tank_m3_max
bed_shape = 0x0,310x0,310x310,0x310
max_print_height = 400
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 1
retract_speed = 40
start_gcode = G21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 ;Move to min endstops\nG1 Z15.0 F9000 ;move the platform down 15mm\nM117 Printing...
end_gcode = M104 T0 S0 ;1st extruder heater off\nM104 T1 S0 ;2nd extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more\nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.20mm Standard @Cura tank m 0.4
default_filament_profile = Generic PLA @Orca @Template
