first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_JGAURORA.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura JGAurora 0.4]
inherits = *common @Cura_JGAurora*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_JGAURORA.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura JGAurora 0.4]
inherits = *common @Cura_JGAurora*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_JGAURORA.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_JGAurora*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:JGAurora A3S 0.4 nozzle]
inherits = *common @Cura_JGAurora*
printer_model = JGAurora A3S
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_JGAURORA\nCURA_DEFINITION_jgaurora_a3s
bed_shape = 0x0,205x0,205x205,0x205
max_print_height = 205
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 8
retract_speed = 45
start_gcode = ; -- START GCODE --\nG21                     ;set units to millimetres\nG90                     ;set to absolute positioning\nM106 S0                 ;set fan speed to zero (turned off)\nG28                     ;home all axis\nG92 E0                  ;zero the extruded length\nG1 Z1 F1000             ;move up slightly\nG1 X60.0 Z0 E9.0 F1000.0;intro line\nG1 X100.0 E21.5 F1000.0 ;continue line\nG92 E0                  ;zero the extruded length again\n; -- end of START GCODE --
end_gcode = ; -- END GCODE --\nM104 S0                 ;turn off nozzle heater\nM140 S0                 ;turn off bed heater\nG91                     ;set to relative positioning\nG1 E-10 F300            ;retract the filament slightly\nG90                     ;set to absolute positioning\nG28 X0                  ;move to the X-axis origin (Home)\nG0 Y200 F600            ;bring the bed to the front for easy print removal\nM84                     ;turn off stepper motors\n; -- end of END GCODE --
default_print_profile = 0.20mm Standard @Cura JGAurora 0.4
default_filament_profile = Generic PLA @Orca @Template

