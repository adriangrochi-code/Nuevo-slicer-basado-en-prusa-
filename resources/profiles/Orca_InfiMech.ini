bed_shape = 0x0,220x0,220x220,0x220
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0
cooling_tube_length = 5
cooling_tube_retraction = 91.5
deretract_speed = 30
end_gcode = PRINT_END
extra_loading_move = -2
extruder_clearance_height = 69
extruder_clearance_radius = 49
extruder_colour = "#FCE94F"
extruder_offset = 0x0
gcode_flavor = klipper
high_current_on_filament_swap = 0
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 20000,20000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 9000,9000
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
max_layer_height = 0.28
max_print_height = 250
min_layer_height = 0.08
parking_pos_retraction = 92
pause_print_gcode = PAUSE
printer_notes = 
retract_before_travel = 1
retract_before_wipe = 0%
retract_layer_change = 1
retract_length = 0.5
retract_length_toolchange = 0
retract_lift = 0.4
retract_lift_above = 0
retract_lift_below = 249
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retract_speed = 30
single_extruder_multi_material = 1
start_gcode = ;v2.9.2-20240814;\n;wiping nozzle start\nM106 P3 S0\nM140 S[first_layer_bed_temperature]\nclean_nozzle_position\n;wiping nozzle end\n;*************preheat nozzle and hotbed for Z_TILT_ADJUST*************\nM140 S[first_layer_bed_temperature]\nM104 S130\nG1 X110 Y110 F10000 \nG4 P200\nprobe\nSET_KINEMATIC_POSITION Z=0 ;Z homing\nG1 Z5\nM190 S[first_layer_bed_temperature]\nZ_TILT_ADJUST \n;*************Z_TILT_ADJUST end*************\nM140 S[first_layer_bed_temperature] ;heat hotbed temp set by user\nG1 X5 Y5 F8000 \nG28 \nG1 X{first_layer_print_min[0]-1.5} Y{min(first_layer_print_min[1] + 100,print_bed_max[0])} F6000 \nG1 Z0 F400\nM104 S[first_layer_temperature] ;heat nozzle temp set by user\nM106 S100 ;close head_nozzle fan\nG4 P3000\nM106 S255 ;close head_nozzle fan\nG4 P3000\nM106 S100 ;close head_nozzle fan\n;*************PRINT START*************\nM109 S[first_layer_temperature] ;heat nozzle temp set by user and wait \nM190 S[first_layer_bed_temperature];heat bed temp set by user and wait \nM106 S0 ;close head_nozzle fan\nBED_MESH_CLEAR                                  \nBED_MESH_PROFILE LOAD=default   # bedmesh load\nG92 E0 ;Reset Extruder\n;G1 Z4.0 F200 ;Move Z Axis up\nG90 ;absolute position\n ; ; ; ; ; ; ; ; ; draw line along model\n;G92 E0 ;reset extruder\nG1 E3 F300 ;extrude filament\nG1 X{first_layer_print_min[0]-1.5} Y{min(first_layer_print_min[1] + 100,print_bed_max[0])} F6000 \nG1 Z0.22 F600\nG1 X{first_layer_print_min[0]-1.5} Y{max(0, first_layer_print_min[1]-1.5)}  F2000 E10\nG1 Z0.22 F600\nG1 X{min(first_layer_print_min[0] + 60,print_bed_max[0])} F1200 E12\n ; ; ; ; ; ; ; ; ;draw line along model end \nG4 P200\nG1 Z2\nG92 E0 ;Reset Extruder\nCLEAR_PAUSE\n;***********model start************\n
template_custom_gcode = 
thumbnails = 300x300/PNG
toolchange_gcode = 
use_firmware_retraction = 0
use_relative_e_distances = 1
wipe = 1

