[print:*common @Cura_Printrbot*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Printrbot 0.4]
inherits = *common @Cura_Printrbot*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_PRINTRBOT.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Printrbot 0.4]
inherits = *common @Cura_Printrbot*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_PRINTRBOT.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Printrbot 0.4]
inherits = *common @Cura_Printrbot*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_PRINTRBOT.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Printrbot*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Printrbot Play 0.4 nozzle]
inherits = *common @Cura_Printrbot*
printer_model = Printrbot Play
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_PRINTRBOT\nCURA_DEFINITION_printrbot_play
bed_shape = 0x0,100x0,100x100,0x100
max_print_height = 130
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 0.7
retract_speed = 45
start_gcode = G21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM106 ;start with the fan on for filament cooling\nG28 X0 Y0 ;move X/Y to min endstops\nG28 Z0 ;move Z to min endstops\nG29 ;run auto bed leveling\nG1 Z15.0 F9000 ;move the platform down 15mm\nG92 E0 ;zero the extruded length\nG1 F200 E10 ;extrude 10mm of feed stock\nG92 E0 ;zero the extruded length again\nG1 F9000\n;Put printing message on LCD screen\nM117 Printing...
end_gcode = M104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more\nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.20mm Standard @Cura Printrbot 0.4
default_filament_profile = Generic PLA @Orca

