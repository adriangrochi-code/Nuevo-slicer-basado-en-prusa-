# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = Fabtotum
config_version = 1.0.1
config_update_url = 

[printer_model:Fabtotum Personal Fabricator]
name = Fabtotum Personal Fabricator
variants = 0.4
technology = FFF
family = Fabtotum
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_Fabtotum*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Fabtotum 0.4]
inherits = *common @Cura_Fabtotum*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FABTOTUM.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Fabtotum 0.4]
inherits = *common @Cura_Fabtotum*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FABTOTUM.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Fabtotum 0.4]
inherits = *common @Cura_Fabtotum*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FABTOTUM.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Fabtotum*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Fabtotum Personal Fabricator 0.4 nozzle]
inherits = *common @Cura_Fabtotum*
printer_model = Fabtotum Personal Fabricator
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_FABTOTUM\nCURA_DEFINITION_fabtotum
bed_shape = 0x0,214x0,214x234,0x234
max_print_height = 241.5
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = ;Layer height: [layer_height]\n;Walls: 0.8\n;Fill: 24\n;Top\Bottom Thickness: 0.6\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nG4 S1 ;1 millisecond pause to buffer the bep bep \nM300 S2 ;FAB bep bep (start the print, go check the oozing and skirt lines adesion) \nG4 S1 ;1 second pause to reach the printer (run fast)\nG92 E0 ;zero the extruded length \nG1 F200 E35    ;slowly extrude 35mm of filament to clean the nozzle and build up extrusion pressure \nG92 E0 ;zero the extruded length again \n;print
end_gcode = M104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300    ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-3 X+5 Y+5 F5000 ;move Z up a bit and retract filament even more\n;end of the print\nM84 ;steppers off\nG90 ;absolute positioning\nM300 S2 ;FAB bep bep (end print)
default_print_profile = 0.20mm Standard @Cura Fabtotum 0.4
default_filament_profile = Generic PLA @Orca @Template
