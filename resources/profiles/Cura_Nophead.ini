first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_NOPHEAD.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Nophead 0.4]
inherits = *common @Cura_Nophead*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_NOPHEAD.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Nophead*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Mendel90 0.4 nozzle]
inherits = *common @Cura_Nophead*
printer_model = Mendel90
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_NOPHEAD\nCURA_DEFINITION_mendel90
bed_shape = -100x-100,100x-100,100x100,-100x100
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = G21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 ;home\nG92 E0 ;zero the extruded length\nM140 S[first_layer_bed_temperature] ; set the bed temperature and continue on\nG1 X-50 Y98 F9000 ;go to the left of the top\nG1 Z0.05 ; close to the bed\nM104 S[first_layer_temperature]; pre-heat the extruder continue on\nM190 S[first_layer_bed_temperature] ;set the bed temp & wait\nM109 S[first_layer_temperature];set the extruder temp for layer 0 & wait\nG92 E0 ;zero the extruded length\nG1 X50 E10 F300 ; make a thick line to prime extruder\nG92 E0 ; reset extruder\nG1 E-4 F1800\nG1 Z0.3 ;lift Z\n
end_gcode = M104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nM107 ;carriage fan off\nG91 ;relative positioning\nG1 Z10 ;Move up Z 10mm\nG90 ;back to absolute mode\nG1 E-1 F1200 ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG92 E0 ;zero the extruded length\nG1 Z200 X-100 F9000 ; go to top\nG1 Y100 F5000 ;Move Y to back\nM42 P42 S255 ;Turn on Bed cooling fan on\nG4 S10 ;Wait 10 seconds\nM42 P42 S0 ;Turn off bed cooling fan\nM84 ;steppers off\n
default_print_profile = 0.20mm Standard @Cura Nophead 0.4
default_filament_profile = Generic PLA @Orca
