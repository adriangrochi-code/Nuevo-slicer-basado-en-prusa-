[vendor]
repo_id = non-prusa-fff
name = Nophead
config_version = 1.0.0
config_update_url = 

[printer_model:Mendel90]
name = Mendel90
variants = 0.4
technology = FFF
family = Nophead
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_Nophead*]
