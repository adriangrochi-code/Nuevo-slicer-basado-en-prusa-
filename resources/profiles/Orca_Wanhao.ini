min_layer_height = 0.10
printer_notes = PRINTER_VENDOR_ORCA_WANHAO
retract_before_travel = 1.5
retract_speed = 40
start_gcode = ; Wanhao D12-300 Start G-code\n; M117 Initial homing sequence.                         ; Home so that the probe is positioned to heat\nG28\nM117 Probe heating position\nG0 X65 Y5 Z1                                                   ; Move the probe to the heating position.\nM117 Getting the heaters up to temp!\nM104 S140                                                          ; Set Extruder temperature, no wait\nM140 S60                                                            ; Set Heat Bed temperature\nM190 S60                                                            ; Wait for Heat Bed temperature\nM117 Waiting for probe to warm!                        ; Wait another 90s for the probe to absorb heat.\nG4 S90\nM117 Post warming re-home\nG28                                                                      ; Home all axes again after warming\nM117 Z-Dance of my people\nG34\nM117 ABL Probing\nG29\nM900 K0 L0 T0                                 ;Edit the K and L values if you have calibrated a k factor for your filament\nM900 T0 S0\nG1 Z2.0 F3000                                        ; Move Z Axis up little to prevent scratching of Heat Bed\nG1 X4.1 Y10 Z0.3 F5000.0                      ; Move to start position\nM117 Getting the extruder up to temp\nM140 S[first_layer_bed_temperature]      ; Set Heat Bed temperature\nM104 S[first_layer_temperature]    ; Set Extruder temperature\nM109 S[first_layer_temperature]    ; Wait for Extruder temperature\nM190 S[first_layer_bed_temperature]      ; Wait for Heat Bed temperature\nG92 E0                                        ; Reset Extruder\nM117 Purging\nG1 X4.1 Y200.0 Z0.3 F1500.0 E15               ; Draw the first line\nG1 X4.4 Y200.0 Z0.3 F5000.0                   ; Move to side a little\nG1 X4.4 Y20 Z0.3 F1500.0 E30                  ; Draw the second line\nG92 E0                                        ; Reset Extruder\nM117 Lets make\nG1 X8 Y20 Z0.3 F5000.0                        ; Move over to prevent blob squish

[printer:*fdm_wanhao_d9_common @Orca_Wanhao*]
inherits = *fdm_wanhao_common @Orca_Wanhao*
deretract_speed = 25
end_gcode = ; Wanhao Duplicator 9 end G-code\nM104 S0 ; nozzle heater off\nM140 S0 ; bed heater off\nM107 ; fan off\nG91 ; relative moves\nG1 E-2 F1500 ; release the pressure in the nozzle\nG1 Z10 F300 ; lift the nozzle\nG90 ; absolute moves\nG1 X5 Y{print_bed_max[1] - 10} F3000 ; bring the bed to the front\nM84 X Y E ; motors off, Z keeps its position
gcode_flavor = marlin2
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 1000,1000
machine_max_acceleration_retracting = 800,800
machine_max_acceleration_travel = 1000,1000
pause_print_gcode = M600
retract_before_travel = 1
retract_length = 2.0
retract_lift = 0
retract_speed = 25
start_gcode = ; Wanhao Duplicator 9 start G-code, for the Marlin 2.1 firmwares at github.com/Le-Syl21/WANHAO-Duplicator-9\nG21 ; millimetres\nG90 ; absolute coordinates\nM83 ; relative extrusion\nM140 S[first_layer_bed_temperature] ; heat the bed\nM104 S150 ; warm the nozzle without letting it ooze\nG91 ; a print stopped by hand can leave the nozzle down on the bed\nG1 Z10 F300 ; so raise it before homing: a BLTouch needs 10 mm to deploy\nG90\nM280 P0 S160 ; BLTouch: clear an alarm and stow the pin\nG28 ; home all axes (this turns bed levelling off)\nM420 S1 ; turn the bed mesh saved from the screen back on\nG1 Z10 F300\nM104 S[first_layer_temperature] ; start the nozzle now, the bed is still heating\nM190 S[first_layer_bed_temperature] ; wait for the bed\nM109 S[first_layer_temperature] ; and confirm the nozzle\nG92 E0\nG1 X15 Y20 Z0.3 F3000 ; start of the priming line\nG1 Y140 E9.0 F1200 ; draw a line of filament\nG1 X15.5 F3000\nG1 Y20 E9.0 F1200 ; and back, next to it\nG92 E0\nG1 X22 F6000 ; wipe sideways to snap the string\nG1 Z2 F300 ; lift, so the line does not stick to the nozzle
wipe = 0

