# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = 3Dator
config_version = 1.0.0
config_update_url = 

[printer_model:3Dator]
name = 3Dator
variants = 0.5
technology = FFF
family = 3Dator
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_3Dator*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.15mm Fine @Cura 3Dator 0.5]
inherits = *common @Cura_3Dator*
layer_height = 0.15
first_layer_height = 0.25
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_3DATOR.*/ and nozzle_diameter[0]==0.5

[print:0.25mm Standard @Cura 3Dator 0.5]
inherits = *common @Cura_3Dator*
layer_height = 0.25
first_layer_height = 0.25
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_3DATOR.*/ and nozzle_diameter[0]==0.5

[print:0.35mm Draft @Cura 3Dator 0.5]
inherits = *common @Cura_3Dator*
layer_height = 0.35
first_layer_height = 0.25
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_3DATOR.*/ and nozzle_diameter[0]==0.5

[printer:*common @Cura_3Dator*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:3Dator 0.5 nozzle]
inherits = *common @Cura_3Dator*
printer_model = 3Dator
printer_variant = 0.5
printer_notes = PRINTER_VENDOR_CURA_3DATOR\nCURA_DEFINITION_3dator
bed_shape = 0x0,180x0,180x170,0x170
max_print_height = 260
nozzle_diameter = 0.5
min_layer_height = 0.1
max_layer_height = 0.38
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 100
start_gcode = ;Sliced at:   \nM104 S[temperature] ;set temperatures\nM140 S[bed_temperature]\nM109 S[temperature] ;wait for temperatures\nM190 S[bed_temperature]\nG21  ;metric values\nG90  ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107  ;start with the fan off\nG28 Z0  ;move Z to min endstops\nG28 X0 Y0  ;move X/Y to min endstops\nG29  ;Auto Level\nG1 Z0.6 F[travel_speed] ;move the Nozzle near the Bed\nG92 E0\nG1 Y0  ;zero the extruded length\nG1 X10 E30 F500  ;printing a Line from right to left\nG92 E0  ;zero the extruded length again\nG1 Z2\nG1 F[travel_speed]\nM117 Printing...;Put printing message on LCD screen\nM150 R255 U255 B255 P4 ;Change LED Color to white
end_gcode = M104 S0                     ;extruder heater off\nM140 S0                     ;heated bed heater off (if you have it)\nG91                                    ;relative positioning\nG1 E-1 F300                            ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F[travel_speed] ;move Z up a bit and retract filament even more\nG28                          ;move X/Y to min endstops, so the head is out of the way\nM84                         ;steppers off\nG90                         ;absolute positioning
default_print_profile = 0.25mm Standard @Cura 3Dator 0.5
default_filament_profile = Generic PLA @Orca
