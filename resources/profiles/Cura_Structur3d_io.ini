[vendor]
repo_id = non-prusa-fff
name = Structur3d.io
config_version = 1.0.1
config_update_url = 

[printer_model:Discov3ry Complete]
name = Discov3ry Complete
variants = 0.84
technology = FFF
family = Structur3d.io
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_Structur3d_io*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.25mm Fine @Cura Structur3d io 0.84]
inherits = *common @Cura_Structur3d_io*
layer_height = 0.25
first_layer_height = 0.42
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_STRUCTUR3D_IO.*/ and nozzle_diameter[0]==0.84

[print:0.42mm Standard @Cura Structur3d io 0.84]
inherits = *common @Cura_Structur3d_io*
layer_height = 0.42
first_layer_height = 0.42
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_STRUCTUR3D_IO.*/ and nozzle_diameter[0]==0.84

[print:0.59mm Draft @Cura Structur3d io 0.84]
inherits = *common @Cura_Structur3d_io*
layer_height = 0.59
first_layer_height = 0.42
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_STRUCTUR3D_IO.*/ and nozzle_diameter[0]==0.84

[printer:*common @Cura_Structur3d_io*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Discov3ry Complete 0.84 nozzle]
inherits = *common @Cura_Structur3d_io*
printer_model = Discov3ry Complete
printer_variant = 0.84
printer_notes = PRINTER_VENDOR_CURA_STRUCTUR3D_IO\nCURA_DEFINITION_structur3d_discov3ry1_complete_um2plus
bed_shape = 0x0,205x0,205x205,0x205
max_print_height = 205
nozzle_diameter = 0.84
min_layer_height = 0.17
max_layer_height = 0.63
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = \n;Updated Firmware (.hex and Marlin .ino) for \n;Ultimaker 2+ with Discov3ry Extruder available at: \n;https://github.com/Structur3d/UM2.1Discov3ry-Firmware-beta \n;**Learn more at https://www.structur3d.io** \n \nM104 S[temperature] ;Start heating extruder  \nM140 S[bed_temperature] ;Start heating bed \nG21 ;metric values \nG90 ;absolute positioning \nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off \nM302 ;allow cold extrusion \nM92 E2589 ;set extruder EEPROM steps/mm for paste \nG28 Z0 ;move Z to bottom endstops \nG28 X0 Y0 ;move X/Y to endstops \nG1 X15 Y0 F4000 ;move X/Y to front of printer \nG1 Z15.0 F9000 ;move the platform to 15mm \nG92 E0 ;zero the extruded length \nG1 F200 E10 ;extrude 10 mm of feed stock \nG92 E0 ;zero the extruded length again \nG1 F9000 \n;Put printing message on LCD screen \nM117 Printing...
end_gcode = M104 S0 ;extruder heater off \nM140 S0 ;heated bed heater off (if you have it) \nM92 E282 ;reset extruder EEPROM steps/mm for plastic filament \nG91 ;relative positioning \nG1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure \nG1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more \nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way \nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.42mm Standard @Cura Structur3d io 0.84
default_filament_profile = Generic PLA @Orca @Template
