first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_Z_BOLT.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Z Bolt 0.4]
inherits = *common @Cura_Z_Bolt*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_Z_BOLT.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Z_Bolt*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Z-Bolt Classic 0.4 nozzle]
inherits = *common @Cura_Z_Bolt*
printer_model = Z-Bolt Classic
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_Z_BOLT\nCURA_DEFINITION_z-bolt_classic
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 240
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = G21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 X0 Y0 ;move X/Y to min endstops\nG28 Z0 ;move Z to min endstops\nG1 Z15.0 F9000 ;move the platform down 15mm\nG92 E0 ;zero the extruded length\nG1 F200 E6 ;extrude 6 mm of feed stock\nG92 E0 ;zero the extruded length again\nG1 F9000\n;Put printing message on LCD screen\nM117 Printing...
end_gcode = 'M104 S0 ;extruder heater off' + ('\nM140 S0 ;heated bed heater off' if machine_heated_bed else '') + '\nG91 ;relative positioning\nG1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more\nG28 X0 Y0 Z0 ;move X/Y to min endstops, so the head is out of the way\nM84 ;steppers off\nG90 ;absolute positioning'
default_print_profile = 0.20mm Standard @Cura Z Bolt 0.4
default_filament_profile = Generic PLA @Orca
