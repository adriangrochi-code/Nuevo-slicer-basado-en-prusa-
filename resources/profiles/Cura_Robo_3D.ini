# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = Robo 3D
config_version = 1.0.1
config_update_url = 

[printer_model:Robo 3D R1]
name = Robo 3D R1
variants = 0.4
technology = FFF
family = Robo 3D
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_Robo_3D*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Robo 3D 0.4]
inherits = *common @Cura_Robo_3D*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ROBO_3D.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Robo 3D 0.4]
inherits = *common @Cura_Robo_3D*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ROBO_3D.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Robo 3D 0.4]
inherits = *common @Cura_Robo_3D*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ROBO_3D.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Robo_3D*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Robo 3D R1 0.4 nozzle]
inherits = *common @Cura_Robo_3D*
printer_model = Robo 3D R1
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_ROBO_3D\nCURA_DEFINITION_robo_3d_r1
bed_shape = 0x0,225x0,225x245,0x245
max_print_height = 210
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 3
retract_speed = 50
start_gcode =  G92 E0 ;\n M565 Z-1 ;\n G1 Z5 F5000 ;\n G29 ;\n
end_gcode =  M104 S0                     ;extruder heater off\n M140 S0                     ;heated bed heater off (if you have it)\n G91                                    ;relative positioning\n G1 E-1 F300                            ;retract the filament a bit before lifting the nozzle, to release some of the pressure\n G1 Z+0.5 E-5 X-20 Y-20 F[travel_speed] ;move Z up a bit and retract filament even more\n G28 X0 Y0                              ;move X/Y to min endstops, so the head is out of the way\n M84                         ;steppers off\n G90                         ;absolute positioning\n
default_print_profile = 0.20mm Standard @Cura Robo 3D 0.4
default_filament_profile = Generic PLA @Orca @Template
