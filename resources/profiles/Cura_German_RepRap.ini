# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = German RepRap
config_version = 1.0.0
config_update_url = 

[printer_model:German RepRap Neo]
name = German RepRap Neo
variants = 0.5
technology = FFF
family = German RepRap
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_German_RepRap*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.15mm Fine @Cura German RepRap 0.5]
inherits = *common @Cura_German_RepRap*
layer_height = 0.15
first_layer_height = 0.25
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_GERMAN_REPRAP.*/ and nozzle_diameter[0]==0.5

[print:0.25mm Standard @Cura German RepRap 0.5]
inherits = *common @Cura_German_RepRap*
layer_height = 0.25
first_layer_height = 0.25
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_GERMAN_REPRAP.*/ and nozzle_diameter[0]==0.5

[print:0.35mm Draft @Cura German RepRap 0.5]
inherits = *common @Cura_German_RepRap*
layer_height = 0.35
first_layer_height = 0.25
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_GERMAN_REPRAP.*/ and nozzle_diameter[0]==0.5

[printer:*common @Cura_German_RepRap*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:German RepRap Neo 0.5 nozzle]
inherits = *common @Cura_German_RepRap*
printer_model = German RepRap Neo
printer_variant = 0.5
printer_notes = PRINTER_VENDOR_CURA_GERMAN_REPRAP\nCURA_DEFINITION_grr_neo
bed_shape = 0x0,150x0,150x150,0x150
max_print_height = 150
nozzle_diameter = 0.5
min_layer_height = 0.1
max_layer_height = 0.38
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = G21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 X0 Y0 ;move X/Y to min endstops\nG28 Z0 ;move Z to min endstops\nG91 ;relative positioning\nG1 Y-10.0000 F9000 ;compensate firmware head move 1cm right after endstop\nG92 Y0 ;zero Y\nG90 ;absolute positioning\nG1 Z15.0 F9000 ;move the platform down 15mm\nG92 E0 ;zero the extruded length\nG1 F200 E3 ;extrude 3mm of feed stock\nG92 E0 ;zero the extruded length again\nG1 F9000\n;Put printing message on LCD screen\nM117 Printing...
end_gcode = M104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more\nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.25mm Standard @Cura German RepRap 0.5
default_filament_profile = Generic PLA @Orca
