[vendor]
repo_id = non-prusa-fff
name = Syndaver3D
config_version = 1.0.0
config_update_url = 

[printer_model:SyndaverAxi]
name = SyndaverAxi
variants = 0.4
technology = FFF
family = Syndaver3D
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[printer_model:SyndaverAxi2]
name = SyndaverAxi2
variants = 0.4
technology = FFF
family = Syndaver3D
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_Syndaver3D*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Syndaver3D 0.4]
inherits = *common @Cura_Syndaver3D*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_SYNDAVER3D.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Syndaver3D 0.4]
inherits = *common @Cura_Syndaver3D*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_SYNDAVER3D.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Syndaver3D 0.4]
inherits = *common @Cura_Syndaver3D*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_SYNDAVER3D.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Syndaver3D*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:SyndaverAxi 0.4 nozzle]
inherits = *common @Cura_Syndaver3D*
printer_model = SyndaverAxi
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_SYNDAVER3D\nCURA_DEFINITION_syndaveraxi
bed_shape = 0x0,280x0,280x280,0x280
max_print_height = 285
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = ;This G-Code has been generated specifically for Syndaver AXI with Hemera toolhead\nM73 P0                                       ; clear LCD progress bar\nM75                                          ; Start LCD Print Timer\nM107                                         ; disable fans\nM420 S0                                      ; disable leveling matrix\nM83 ; relative extrusion (Tisma)\nG92 E0                                       ; set extruder position to 0\nM140 S[first_layer_bed_temperature]     ; start bed heating up\nM104 S170                                    ; start nozzle heating up\nG28                                          ; home all axes\nM117 AXI Heating Up...\nG1 X-17.5 Y100 F3000                         ; move to wiper pad\nG1 Z10 F5000                                 ; move to wiper pad\nG29 L1                                       ; load leveling matrix slot 1\nG29 A                                        ; ensure mesh is enabled\nM109 R170                                    ; wait for nozzle to reach wiping temp\nG1 E-3                                       ; retract material before wipe\nM117 AXI Wiping Nozzle...\nG1 Z-3                                       ; lower nozzle\nG1 Y90 F1000                                 ; slow wipe\nG1 Y65 F1000                                 ; slow wipe\nG1 Y80 F1000                                 ; slow wipe\nG1 Y65 F1000                                 ; slow wipe\nG1 Y55 F1000                                 ; slow wipe\nG1 Y30 F3000                                 ; fast wipe\nG1 Y55 F3000                                 ; fast wipe\nG1 Y30 F3000                                 ; fast wipe\nG1 Y55 F3000                                 ; fast wipe\nG1 Z10                                       ; raise nozzle\nM117 Heating...\nM190 R[first_layer_bed_temperature]     ; wait for bed to reach printing temp\nM104 S[first_layer_temperature]   ; set extruder to reach initial printing temp, held back for ooze reasons\nM117 Probe Z at Temp\nG28 Z                                        ; re-probe Z0 to account for any thermal expansion in the bed\nG1 X-17.5 Y80 F3000                          ; move to wiper pad\nG1 Z10 F5000                                 ; move to wiper pad\nM117 Heating...\nM109 R[first_layer_temperature]   ; wait for extruder to reach initial printing temp\nM117 AXI Wiping Nozzle...\nG1 E0                                        ; prime material in nozzle\nG1 Z-3                                       ; final ooze wipe\nG1 Y60 F2000                                 ; final ooze wipe\nG1 Y20 F2000                                 ; final ooze wipe\nM117 AXI Starting Print\nG1 Z2                                        ; move nozzle back up to not run into things on print start\nM400                                         ; wait for moves to finish\nM117 AXI Printing
end_gcode = M400                                               ; wait for moves to finish\nM140 S50                                           ; start bed cooling\nM104 S0                                            ; disable hotend\nM107                                               ; disable fans\nM117 Cooling please wait\nG91                                                ; relative positioning\nG1 Z5 F3000                                        ; move Z up 5mm so it wont drag on the print\nG90                                                ; absolute positioning\nG1 X5 Y5 F3000                                     ; move to cooling position\nM190 R50                                           ; wait for bed to cool down to removal temp\nG1 X145 Y260 F1000                                 ; present finished print\nM140 S0                                            ; cool down bed\nM77                                                ; End LCD Print Timer\nM18 X Y E                                          ; turn off x y and e axis\nM117 Print Complete.
default_print_profile = 0.20mm Standard @Cura Syndaver3D 0.4
default_filament_profile = Generic PLA @Orca

