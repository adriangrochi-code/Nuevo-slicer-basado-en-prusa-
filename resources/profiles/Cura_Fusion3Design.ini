top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Fusion3Design 0.4]
inherits = *common @Cura_Fusion3Design*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FUSION3DESIGN.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Fusion3Design 0.4]
inherits = *common @Cura_Fusion3Design*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FUSION3DESIGN.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Fusion3Design 0.4]
inherits = *common @Cura_Fusion3Design*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FUSION3DESIGN.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Fusion3Design*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Fusion3 F410 0.4 nozzle]
inherits = *common @Cura_Fusion3Design*
printer_model = Fusion3 F410
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_FUSION3DESIGN\nCURA_DEFINITION_fusion3_f410
bed_shape = 0x0,355x0,355x355,0x355
max_print_height = 315
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = reprapfirmware
retract_length = 6.5
retract_speed = 100
start_gcode = ; Fusion3 F410 start code\nM104 S0 ; shutdown heater and prepare to print\nG21  ; set units to mm\nG90  ; use absolute coordinates\nT0  ; select tool 0\nG92 E0.0  ; reset e count\nM220 S100 ; reset speed multiplier\nM140 S[first_layer_bed_temperature]  ; set bed temp and do not wait\nG32  ; call to run bed.g\nM190 S[first_layer_bed_temperature] ; Set bed temperature and wait\nM109 S[first_layer_temperature] ; set print head temperature and wait\n; === pause for heating ===\n; reset filament monitor\nM42 P63 S0\nG4 P100\nG4 P50\nM42 P63 S1\nG1 X350 Y0\nG1 Z10.0 F2000  ; move up\nG1 E10.0 F500  ; prime extruder\nG92 E0.0  ; reset e count\nG1 X330 Y15 F9000  ; move back\nG1 Z[first_layer_height] F1000  ; move down to begin wipe\nG1 X150 E4.0 F6000  ; wipe print head (extrude material while we do this)\nG92 E0.0  ; reset e count\n
end_gcode = ; Fusion3 F410 end code\nG91  ;relative positioning\nG1 E-5.00 F1000  ;retract 5mm of filament\nG1 Z+1.00 X-20.0 Y+20.0 F10000  ;short quick move to disengage from print\nG90  ;absolute positioning\nG1 X0.0 Y350.0 F9000  ; move head to back left corner\nG91  ; relative positioning\nG1 E-5.00 F500  ;retract additional filament to prevent oozing\nG90 ;absolute positioning\nM104 S0  ;turn off hotend\nM140 S0  ;turn off heatbed\n; Reset filament monitor\nM42 P63 S0\nG4 P100\nG4 P50\nM42 P63 S1\nG1 Z315 F1000 ;move print bed down to idle position\nM106 S0  ; shut off blower\nM84  ;motors off\nM561  ;clear bed probe transformation\n
default_print_profile = 0.20mm Standard @Cura Fusion3Design 0.4
default_filament_profile = Generic PLA @Orca @Template
