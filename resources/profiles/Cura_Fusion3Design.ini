[printer_model:Fusion3 F410]
name = Fusion3 F410
variants = 0.4
technology = FFF
family = Fusion3Design
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_Fusion3Design*]
