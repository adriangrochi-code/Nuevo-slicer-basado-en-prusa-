notes = Deutsch P1 Polymaker Polymax PETG Readme\n1.	Überprüfen Sie, dass sich das Polymaker Polymax PETG im linken Extruder befindet. Halten Sie das Filament trocken! Detailierte Trocknungsanleitung, siehe unten.\n2.	Überprüfen Sie, dass sich eine 0,4 mm Wolfram-Kupfer Düse im linken Extruder befindet.\n3.	Verwenden Sie Magigoo Kleber auf der PET-Folie, um eine bessere Haftung zu gewährleisten. ( im Singledruck in der Regel auf PET-Folie nicht erforderlich)\n4.	Reinigen Sie ggf. die Düse mit einer Messing-Drahtbürste.\nNun sind sie bereit, um Ihren Druck zu starten.\n\nAnleitung zum Trocknen von PETG:\nPETG-ESD ist hydrophil. Wenn Sie Stringing und Oozing an Ihrem Bauteil beobachten, ist dies ein Indiz dafür, dass das Filament zu feucht ist. Um das Filament zu trocknen, belassen Sie die Spule in einem industriellen Ofen bei 70°C für 8 Stunden.\n\nEnglish P1 Polymaker Polymax PETG\n1.	Check Left extruder filament: Polymaker Polymax PETG - Keep the filament dry!! Detailed drying instruction below.\n2.	Check left extruder nozzle: 0.4mm Wolfram\n3.	Check bed: PET with Magigoo glue (not realy needed in a singelprint)\n4.	Check nozzle: Clean it with brush\nWELLDONE! YOU ARE READY NOW TO START YOUR PRINT JOB!\n\nFILAMENT DRYING INSTRUCTION\nPETG-ESD material is hydroscopic. If you feel you have stringing and oozing in your printed part, the filament have moisture in it.\nTo dry the filament, keep the spool in a industrial oven for 8 hours at 70°C.\n
