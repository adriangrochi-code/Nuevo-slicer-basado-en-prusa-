# Tisma Slicer: Elegoo MSLA resin printers that read the open GOO format (exported directly, no conversion).
#
# Sources: the screen resolution and size and the maximum height are Elegoo's published specifications, checked
# against the PrusaSlicer printer profiles of UVtools (AGPLv3, https://github.com/sn4k3/UVtools, PrusaSlicer/printer),
# which also give the lift, retraction and wait values of each model. Exposures: inside Elegoo's published range for
# its standard resin at 0.05 mm (normal 2.5-3 s, bottom 25-35 s). They are starting points: print an exposure test
# for each resin. The Mars 5 Ultra and the Saturn 4 Ultra use the encrypted CTB format and are not included.

[vendor]
repo_id = non-prusa-sla
# Vendor name will be shown by the Config Wizard.
name = Elegoo SLA
config_version = 1.0.0
# No online updates: the bundle comes with Tisma.
config_update_url = 

[printer_model:MARS 4]
name = Elegoo Mars 4
variants = default
technology = SLA
family = MARS
default_materials = Generic Standard Resin @ELEGOO MARS

[printer_model:MARS 4 ULTRA]
name = Elegoo Mars 4 Ultra
variants = default
technology = SLA
family = MARS
default_materials = Generic Standard Resin @ELEGOO MARS

[printer_model:MARS 4 MAX]
name = Elegoo Mars 4 Max
variants = default
technology = SLA
family = MARS
default_materials = Generic Standard Resin @ELEGOO MARS

[printer_model:MARS 5]
name = Elegoo Mars 5
variants = default
technology = SLA
family = MARS
default_materials = Generic Standard Resin @ELEGOO MARS

[printer_model:SATURN 3]
name = Elegoo Saturn 3
variants = default
technology = SLA
family = SATURN
default_materials = Generic Standard Resin @ELEGOO SATURN

[printer_model:SATURN 3 ULTRA]
name = Elegoo Saturn 3 Ultra
variants = default
technology = SLA
family = SATURN
default_materials = Generic Standard Resin @ELEGOO SATURN

[printer_model:SATURN 4]
name = Elegoo Saturn 4
variants = default
technology = SLA
family = SATURN
default_materials = Generic Standard Resin @ELEGOO SATURN 4

## Print

[sla_print:*common print ELEGOO SLA*]
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_ELEGOO.*/ and printer_notes=~/.*PRINTER_TECHNOLOGY_SLA.*/
layer_height = 0.05
output_filename_format = [input_filename_base].goo
# Bottom layers in the GOO file (all with the bottom exposure).
faded_layers = 5
pad_edge_radius = 0.5
pad_enable = 1
pad_max_merge_distance = 50
pad_wall_height = 0
pad_wall_thickness = 1
pad_wall_slope = 45
slice_closing_radius = 0.005
support_base_diameter = 3
support_base_height = 1
support_critical_angle = 45
support_density_at_45 = 250
support_density_at_horizontal = 500
support_head_front_diameter = 0.4
support_head_penetration = 0.4
support_head_width = 3
support_max_bridge_length = 10
support_minimal_z = 0
support_object_elevation = 5
support_pillar_diameter = 1
support_pillar_connection_mode = zigzag
support_pillar_widening_factor = 0
supports_enable = 1
support_small_pillar_diameter_percent = 60%

[sla_print:0.05 Normal @ELEGOO]
inherits = *common print ELEGOO SLA*
layer_height = 0.05

## Materials

[sla_material:*common ELEGOO SLA*]
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_ELEGOO.*/ and printer_notes=~/.*PRINTER_TECHNOLOGY_SLA.*/
compatible_prints_condition = layer_height == 0.05
exposure_time = 2.5
initial_exposure_time = 30
initial_layer_height = 0.05
material_correction = 1,1,1
material_type = Tough
material_vendor = Generic
material_colour = #808080

# Lift and retraction from the model defaults (UVtools profiles). Distances in mm, speeds in mm/s, waits in s.
# Mars: bottom lift 7 mm at 80 mm/min, lift 5 mm at 100 mm/min, retraction at 150 mm/min.
[sla_material:Generic Standard Resin @ELEGOO MARS]
inherits = *common ELEGOO SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_ELEGOO.*/ and printer_notes=~/.*ELEGOO_MOTION_MARS\n.*/
material_notes = #Distances in mm, speeds in mm/s, waits in s.\nLIFT_DISTANCE=5\nLIFT_SPEED=1.6667\nBOTTOM_LIFT_DISTANCE=7\nBOTTOM_LIFT_SPEED=1.3333\nRETRACT_SPEED=2.5\nDELAY_BEFORE_EXPOSURE=2.5\nWAIT_AFTER_CURE=1\nANTIALIASING=8

# Saturn 3: lift 7 mm at 70 mm/min, retraction at 210 mm/min.
[sla_material:Generic Standard Resin @ELEGOO SATURN]
inherits = *common ELEGOO SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_ELEGOO.*/ and printer_notes=~/.*ELEGOO_MOTION_SATURN\n.*/
material_notes = #Distances in mm, speeds in mm/s, waits in s.\nLIFT_DISTANCE=7\nLIFT_SPEED=1.1667\nBOTTOM_LIFT_DISTANCE=7\nBOTTOM_LIFT_SPEED=1.1667\nRETRACT_SPEED=3.5\nDELAY_BEFORE_EXPOSURE=1\nANTIALIASING=8

# Saturn 4: as the Saturn 3, with a wait of 0.5 s before the exposure.
[sla_material:Generic Standard Resin @ELEGOO SATURN 4]
inherits = *common ELEGOO SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_ELEGOO.*/ and printer_notes=~/.*ELEGOO_MOTION_SATURN4\n.*/
material_notes = #Distances in mm, speeds in mm/s, waits in s.\nLIFT_DISTANCE=7\nLIFT_SPEED=1.1667\nBOTTOM_LIFT_DISTANCE=7\nBOTTOM_LIFT_SPEED=1.1667\nRETRACT_SPEED=3.5\nDELAY_BEFORE_EXPOSURE=0.5\nANTIALIASING=8

