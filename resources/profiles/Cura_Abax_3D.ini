# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = Abax 3D
config_version = 1.0.0
config_update_url = 

[printer_model:Abax PRi3]
name = Abax PRi3
variants = 0.4
technology = FFF
family = Abax 3D
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_Abax_3D*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Abax 3D 0.4]
inherits = *common @Cura_Abax_3D*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ABAX_3D.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Abax 3D 0.4]
inherits = *common @Cura_Abax_3D*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ABAX_3D.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Abax 3D 0.4]
inherits = *common @Cura_Abax_3D*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ABAX_3D.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Abax_3D*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Abax PRi3 0.4 nozzle]
inherits = *common @Cura_Abax_3D*
printer_model = Abax PRi3
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_ABAX_3D\nCURA_DEFINITION_abax_pri3
bed_shape = 0x0,225x0,225x220,0x220
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = ; -- START GCODE --\nG21                     ;set units to millimetres\nG90                     ;set to absolute positioning\nM106 S0                 ;set fan speed to zero (turned off)\nG28 X0 Y0               ;move to the X/Y origin (Home)\nG28 Z0                  ;move to the Z origin (Home)\nG1 Z5.0 F200          ;move Z to position 5.0 mm\nG92 E0                  ;zero the extruded length\n; -- end of START GCODE --
end_gcode = ; -- END GCODE --\nM104 S0                 ;set extruder temperature to zero (turned off)\nM140 S0  ;set temp of bed to Zero  \nG91                     ;set to relative positioning\nG1 E-10 F300            ;retract the filament a bit to release some of the pressure\nG1 F2000 X0 Y215                 ;move X to min and Y to max \nG90                     ;set to absolute positioning\nM84                     ;turn off steppers\n; -- end of END GCODE --
default_print_profile = 0.20mm Standard @Cura Abax 3D 0.4
default_filament_profile = Generic PLA @Orca
