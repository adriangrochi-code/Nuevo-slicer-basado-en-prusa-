[vendor]
repo_id = non-prusa-fff
name = Felix
config_version = 1.0.1
config_update_url = 

[printer_model:Felix Tec 4 Dual]
name = Felix Tec 4 Dual
variants = 0.35
technology = FFF
family = Felix
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_Felix*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.10mm Fine @Cura Felix 0.35]
inherits = *common @Cura_Felix*
layer_height = 0.1
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FELIX.*/ and nozzle_diameter[0]==0.35

[print:0.17mm Standard @Cura Felix 0.35]
inherits = *common @Cura_Felix*
layer_height = 0.17
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FELIX.*/ and nozzle_diameter[0]==0.35

[print:0.24mm Draft @Cura Felix 0.35]
inherits = *common @Cura_Felix*
layer_height = 0.24
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_FELIX.*/ and nozzle_diameter[0]==0.35

[printer:*common @Cura_Felix*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Felix Tec 4 Dual 0.35 nozzle]
inherits = *common @Cura_Felix*
printer_model = Felix Tec 4 Dual
printer_variant = 0.35
printer_notes = PRINTER_VENDOR_CURA_FELIX\nCURA_DEFINITION_felixtec4dual
bed_shape = 0x0,255x0,255x205,0x205
max_print_height = 225
nozzle_diameter = 0.35
min_layer_height = 0.07
max_layer_height = 0.26
gcode_flavor = repetier
retract_length = 1
retract_speed = 50
start_gcode = ; FELIXprinters | www.FELIXprinters.com | Zeemanlaan 15 3401 MV IJsselstein The Netherlands\n; FELIX Tec 4 | Start Code Dual Extruders v1.0\n; Modified by kerog777@gmail.com\n;================================ \n;Initializing\nM80   ; Turn on the power supply\nM107     ; Turn off fans\nM117 Heating up\nM190 S[bed_temperature]   ; Heatup Bed\nM104 T0 S120\nM104 T1 S120\nG28             ; Home all\nM109 T0 S[first_layer_temperature]   ; Heatup hot-end\nM117 Purging\nT0    ; Select extruder 1\nG92 E0    ; Reset extruder\nG1 X10.0 Y1.1 Z5.0 F15240   ; Move to start-line position\nG1 Z0.3 F15240    ; Move z up\nG1 X127.0 Y1.1 Z0.3 F1500.0 E15    ; Purge 1st line\nG92 E0    ; Reset extruder\n\n;================================ ; Initializing done\nM117 FELIXprinting
end_gcode = ; FELIXprinters End Code Tec Series v1.0\n; Modified by kerog777@gmail.com\n; ================================= \n; Move extruder to park position\nG91       ; Make coordinates relative\nG1 Z2 F1000       ; Move z 2mm up\nG90       ; Use absolute coordinates again\nG1 X0 Y0 F15240   ; Move bed and printhead to ergonomic position\n\n; ================================= ; Turn off heaters\nM140 S0    ; Turn off bed heater\nT0    ; Select left extruder\nM104 T0 S0    ; Turn off heater and continue\nG92 E0    ; Reset extruder position\nG1 E-6    ; Retract filament 8mm\nG92 E0    ; Reset extruder position\nT1    ; Select right extruder\nM104 T1 S0    ; Turn off heater and continue\nG92 E0    ; Reset extruder position\nG1 E-6    ; Retract filament 8mm\nG92 E0    ; Reset extruder position\nT0    ; Select left extruder\n\n; ================================= ; Turn the rest off\nM107        ; Turn off fan\nM84    ; Disable steppers\nM117 Finished Printing!
default_print_profile = 0.17mm Standard @Cura Felix 0.35
default_filament_profile = Generic PLA @Orca @Template
