# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = Liquid 3D
config_version = 1.0.0
config_update_url = 

[printer_model:Liquid]
name = Liquid
variants = 0.4
technology = FFF
family = Liquid 3D
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_Liquid_3D*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Liquid 3D 0.4]
inherits = *common @Cura_Liquid_3D*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_LIQUID_3D.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Liquid 3D 0.4]
inherits = *common @Cura_Liquid_3D*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_LIQUID_3D.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Liquid 3D 0.4]
inherits = *common @Cura_Liquid_3D*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_LIQUID_3D.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Liquid_3D*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Liquid 0.4 nozzle]
inherits = *common @Cura_Liquid_3D*
printer_model = Liquid
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_LIQUID_3D\nCURA_DEFINITION_liquid
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = reprapfirmware
retract_length = 3
retract_speed = 35
start_gcode = G21 ; set units to millimeters\nG90 ; use absolute positioning\nM83 ; relative extrusion mode\nM104 S[first_layer_temperature] ; set extruder temp\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nG32 ; mesh bed leveling\nG92 E0.0 ; reset extruder distance position\nG1 X0 Y-2 Z0.3 F4000.0 ; go outside print area\nG1 X60.0 E9.0 F1000.0 ; intro line\nG1 X110.0 E15.5 F1000.0 ; intro line\nG92 E0.0 ; reset extruder distance position
end_gcode = M104 S0 ; turn off extruder\nM140 S0 ; turn off heatbed\nM106 S0 ; turn off fan\nG91 ; relative positioning\nG1 Z1 F360 ; lift Z by 1mm\nG90 ; absolute positioning\nG1 X10 Y200 F3200; home X axis and push Y forward\nG1 Z200 F1200; home Z axis\nM84 ; disable motors
default_print_profile = 0.20mm Standard @Cura Liquid 3D 0.4
default_filament_profile = Generic PLA @Orca
