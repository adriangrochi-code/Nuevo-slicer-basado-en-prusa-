# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = Prusa (Cura)
config_version = 1.0.1
config_update_url = 

[printer_model:Prusa i3 Mk2]
name = Prusa i3 Mk2
variants = 0.4
technology = FFF
family = Prusa (Cura)
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[printer_model:Prusa i3 xl]
name = Prusa i3 xl
variants = 0.4
technology = FFF
family = Prusa (Cura)
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_Prusa3D*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Prusa3D 0.4]
inherits = *common @Cura_Prusa3D*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_PRUSA3D.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Prusa3D 0.4]
inherits = *common @Cura_Prusa3D*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_PRUSA3D.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Prusa3D 0.4]
inherits = *common @Cura_Prusa3D*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_PRUSA3D.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Prusa3D*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Prusa i3 Mk2 0.4 nozzle]
inherits = *common @Cura_Prusa3D*
printer_model = Prusa i3 Mk2
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_PRUSA3D\nCURA_DEFINITION_prusa_i3_mk2
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 0.8
retract_speed = 35
start_gcode = G21 ; set units to millimeters\nG90 ; use absolute positioning\nM83 ; relative extrusion (Tisma)\nM104 S[first_layer_temperature] ; set extruder temp\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nG28 W ; home all without mesh bed level\nG80 ; mesh bed leveling\nG92 E0.0 ; reset extruder distance position\nG1 Y-3.0 F1000.0 ; go outside print area\nG1 X60.0 E9.0 F1000.0 ; intro line\nG1 X100.0 E21.5 F1000.0 ; intro line\nG92 E0.0 ; reset extruder distance position
end_gcode = M104 S0 ; turn off extruder\nM140 S0 ; turn off heatbed\nM107 ; turn off fan\nG1 X0 Y210; home X axis and push Y forward\nM84 ; disable motors
default_print_profile = 0.20mm Standard @Cura Prusa3D 0.4
default_filament_profile = Generic PLA @Orca @Template

[printer:Prusa i3 xl 0.4 nozzle]
inherits = *common @Cura_Prusa3D*
printer_model = Prusa i3 xl
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_PRUSA3D\nCURA_DEFINITION_prusa_i3_xl
bed_shape = 0x0,200x0,200x270,0x270
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = G21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 X0 Y0 ;move X/Y to min endstops\nG28 Z0 ;move Z to min endstops\nG1 Z15.0 F9000 ;move the platform down 15mm\nG92 E0 ;zero the extruded length\nG1 F200 E3 ;extrude 3mm of feed stock\nG92 E0 ;zero the extruded length again\nG1 F9000\n;Put printing message on LCD screen\nM117 Printing...
end_gcode = M104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300  ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more\nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.20mm Standard @Cura Prusa3D 0.4
default_filament_profile = Generic PLA @Orca @Template
