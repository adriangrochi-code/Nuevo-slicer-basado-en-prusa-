# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = Alfawise
config_version = 1.0.0
config_update_url = 

[printer_model:Alfawise U20]
name = Alfawise U20
variants = 0.4
technology = FFF
family = Alfawise
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[printer_model:Alfawise U30]
name = Alfawise U30
variants = 0.4
technology = FFF
family = Alfawise
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_Alfawise*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura Alfawise 0.4]
inherits = *common @Cura_Alfawise*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ALFAWISE.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura Alfawise 0.4]
inherits = *common @Cura_Alfawise*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ALFAWISE.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura Alfawise 0.4]
inherits = *common @Cura_Alfawise*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_ALFAWISE.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_Alfawise*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:Alfawise U20 0.4 nozzle]
inherits = *common @Cura_Alfawise*
printer_model = Alfawise U20
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_ALFAWISE\nCURA_DEFINITION_alfawise_u20
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 400
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 5
retract_speed = 45
start_gcode = ; -- START GCODE --\nG21                     ;set units to millimetres\nG90                     ;set to absolute positioning\nM106 S0                 ;set fan speed to zero (turned off)\nG28                     ;home all axis\nG92 E0                  ;zero the extruded length\nG1 Z1 F1000             ;move up slightly\nG1 Y60.0 Z0 E9.0 F1000.0;intro line\nG1 Y100.0 E21.5 F1000.0 ;continue line\nG92 E0                  ;zero the extruded length again\n; -- end of START GCODE --
end_gcode = ; -- END GCODE --\nM104 S0                 ;turn off nozzle heater\nM140 S0                 ;turn off bed heater\nG91                     ;set to relative positioning\nG1 E-10 F300            ;retract the filament slightly\nG90                     ;set to absolute positioning\nG28 X0                  ;move to the X-axis origin (Home)\nG0 Y280 F600            ;bring the bed to the front for easy print removal\nM84                     ;turn off stepper motors\n; -- end of END GCODE --
default_print_profile = 0.20mm Standard @Cura Alfawise 0.4
default_filament_profile = Generic PLA @Orca

[printer:Alfawise U30 0.4 nozzle]
inherits = *common @Cura_Alfawise*
printer_model = Alfawise U30
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_ALFAWISE\nCURA_DEFINITION_alfawise_u30
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 5
retract_speed = 45
start_gcode = ; -- START GCODE --\nG21        ;metric values\nG90        ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107       ;start with the fan off\nG28 X0 Y0  ;move X/Y to min endstops\nG28 Z0     ;move Z to min endstops\nG1 Z1 F1000             ;move up slightly\nG1 Y60.0 Z0 E9.0 F1000.0;intro line\nG1 Y100.0 E21.5 F1000.0 ;continue line\nG92 E0                  ;zero the extruded length again\nG1 F80\n;Put printing message on LCD screen\nM117 Printing...\n; -- end of START GCODE --
end_gcode = ; -- END GCODE --\nM104 S0                     ;extruder heater off\nM140 S0                     ;heated bed heater off (if you have it)\nG91                                    ;relative positioning\nG1 E-1 F300                            ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+0.5 E-5 X-20 Y-20 F80 ;move Z up a bit and retract filament even more\nG28 X0 Y0                              ;move X/Y to min endstops, so the head is out of the way\nM84                         ;steppers off\nG90                         ;absolute positioning\nM107       ;turn the fan off; -- end of END GCODE --
default_print_profile = 0.20mm Standard @Cura Alfawise 0.4
default_filament_profile = Generic PLA @Orca
