_length[current_extruder]}\n  {endif}\n\n  G1 F{speed_tc}\n  M204 S7000\n\n  G27 W3 Z{retract_lift[current_extruder]} P2 R{retract_toolchange} V{tc_retract_speed/60} A{travel_slope[current_extruder]}\n  P0 S1 L0 D0\n\n\n  T{next_extruder} S1 L0 D0\n\n  M104 S{eject_temp+15}\n\n  G12 S90 ; enter cleaner\n\n  G0 Z{layer_z + 0.8} ; Lift\n\n  M109 C{eject_temp} ; Skip residency\n\n  M104 S{target_temp + 5}\n\n  {if ((false == false) or (tool_init[next_extruder] == 0))}\n  ;-------Purge Station specific Gcode Start-----\n\n    {if tool_init[next_extruder] == 1}\n      ; INDX final lock extrusion\n      G1 E1.6 F{20 * 60} ; Final lock tool\n      ; End final lock extrusion\n    {endif}\n\n    G12 S30 ; eject poop\n\n    M106 S{255 / 100 * 100}\n\n    M906 P1 ; Set extruder current\n\n    M109 C{target_temp}\n    M104 S{target_temp}\n\n    G1 E{deretract_length} F{tc_deretract_speed}\n\n    G91 ; use relative coordinates\n    M83 ; extruder relative mode\n    M572 S0.0 ; Disable PressureAdvance\n\n    ;FLUSH_START\n    G1 X-0.2  E{0}                F{1200}\n    G1 X0.40  E{0.15 * purge_mm}  F{0.40 / (0.15 * purge_mm) * purge_speed_slow}\n    G1 Y-1.20 E{0.35 * purge_mm}  F{1.20 / (0.35 * purge_mm) * purge_speed_fast}\n    G1 X-0.4  E{0.20 * purge_mm}  F{0.40 / (0.20 * purge_mm) * purge_speed_fast}\n    G1 Y1.20  E{0.25 * purge_mm}  F{1.20 / (0.25 * purge_mm) * purge_speed_fast}\n    G1 X0.20  E{0.05 * purge_mm}  F{0.20 / (0.05 * purge_mm) * purge_speed_fast}\n    ;FLUSH_END\n\n    M400\n    M906 P0 ; Revert extruder current\n\n    ; RETRACT AFTER TOOLCHANGE START\n    G1 Y0 E-{retract_length[next_extruder] + 0.04} F{30 * 60}\n\n    {e_retracted[next_extruder] = retract_length[next_extruder] + retract_restart_extra_toolchange[next_extruder]}\n    ; RETRACT AFTER TOOLCHANGE END\n\n    G1 Y5 F{speed_tc}\n\n  ;-------Purge Station specific Gcode End-----\n\n\n\n\n  {else}\n  ;-------Wipe Tower specific Gcode Start-----\n\n    G1 E2.0 F{30 * 60}\n\n    G750 Y85 F21000 A\n    G750 Y93 F21000 A\n    G750 Y82 F21000 A\n    G750 Y98.5 F21000 A\n    G750 Y75 F21000 A\n    G750 Y98.5 F21000 A\n\n    M109 C{target_temp}\n    M104 S{target_temp}\n\n    G1 E{deretract_length-2.0-retract_length[next_extruder]+1.2} F{tc_deretract_speed}\n    {e_retracted[next_extruder] = retract_length[next_extruder]}\n    G1 F{speed_tc} ;revert travel speed\n\n  ;-------Wipe Tower specific Gcode End-----\n  {endif}\n\n  {tool_init[next_extruder] = 1}\n\n  G90 ; use absolute coordinates\n  M83 ; extruder relative mode\n  G12 S91 ; Exit cleaning station\n  G0 Z{layer_z + 1.0} ; Lift\n  G4 S0\n{else}\n  T{next_extruder} S1 L0 D0\n{endif}
