# Printers converted from UltiMaker Cura (https://github.com/Ultimaker/Cura, resources/definitions), LGPLv3.
# Generated by tools/profiles/convert_cura_profiles.py from commit 5bea2f86153faed3a1c2d9081b8d6b753684678a. Do not edit: run the converter again.

[vendor]
repo_id = non-prusa-fff
name = RigidBot
config_version = 1.0.0
config_update_url = 

[printer_model:RigidBot]
name = RigidBot
variants = 0.4
technology = FFF
family = RigidBot
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[printer_model:RigidBotBig]
name = RigidBotBig
variants = 0.4
technology = FFF
family = RigidBot
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_RigidBot*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura RigidBot 0.4]
inherits = *common @Cura_RigidBot*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_RIGIDBOT.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura RigidBot 0.4]
inherits = *common @Cura_RigidBot*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_RIGIDBOT.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura RigidBot 0.4]
inherits = *common @Cura_RigidBot*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_RIGIDBOT.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_RigidBot*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:RigidBot 0.4 nozzle]
inherits = *common @Cura_RigidBot*
printer_model = RigidBot
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_RIGIDBOT\nCURA_DEFINITION_rigidbot
bed_shape = 0x0,254x0,254x254,0x254
max_print_height = 254
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = ;Basic settings: Layer height: [layer_height] Walls: 0.8 Fill: 20\nG21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 X0 Y0 ;move X/Y to min endstops\nG28 Z0 ;move Z to min endstops\nM205 X8 ;X/Y Jerk settings\nG1 Z15.0 F[travel_speed] ;move the platform down 15mm\nG92 E0 ;zero the extruded length\nG1 F200 E7 ;extrude 3mm of feed stock\nG92 E0 ;zero the extruded length again\nG1 F[travel_speed]\n;Put printing message on LCD screen\nM117 Rigibot Printing...
end_gcode = ;End GCode\nM104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300 ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+10 E-1 X-20 Y-20 F[travel_speed] ;move Z up a bit and retract filament even more\nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\nG1 Y230 F3000 ;move Y so the head is out of the way and Plate is moved forward\nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.20mm Standard @Cura RigidBot 0.4
default_filament_profile = Generic PLA @Orca

[printer:RigidBotBig 0.4 nozzle]
inherits = *common @Cura_RigidBot*
printer_model = RigidBotBig
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_RIGIDBOT\nCURA_DEFINITION_rigidbot_big
bed_shape = 0x0,400x0,400x300,0x300
max_print_height = 254
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = ;Basic settings: Layer height: [layer_height] Walls: 0.8 Fill: 20\n;Print time: \n;M190 S[bed_temperature] ;Uncomment to add your own bed temperature line\n;M109 S[temperature] ;Uncomment to add your own temperature line\nG21 ;metric values\nG90 ;absolute positioning\nM83 ; relative extrusion (Tisma)\nM107 ;start with the fan off\nG28 X0 Y0 ;move X/Y to min endstops\nG28 Z0 ;move Z to min endstops\nM205 X8 ;X/Y Jerk settings\nG1 Z15.0 F[travel_speed] ;move the platform down 15mm\nG92 E0 ;zero the extruded length\nG1 F200 E7 ;extrude 3mm of feed stock\nG92 E0 ;zero the extruded length again\nG1 F[travel_speed]\n;Put printing message on LCD screen\nM117 Rigibot Printing...
end_gcode = ;End GCode\nM104 S0 ;extruder heater off\nM140 S0 ;heated bed heater off (if you have it)\nG91 ;relative positioning\nG1 E-1 F300 ;retract the filament a bit before lifting the nozzle, to release some of the pressure\nG1 Z+10 E-1 X-20 Y-20 F[travel_speed] ;move Z up a bit and retract filament even more\nG28 X0 Y0 ;move X/Y to min endstops, so the head is out of the way\nG1 Y230 F3000 ;move Y so the head is out of the way and Plate is moved forward\nM84 ;steppers off\nG90 ;absolute positioning
default_print_profile = 0.20mm Standard @Cura RigidBot 0.4
default_filament_profile = Generic PLA @Orca
