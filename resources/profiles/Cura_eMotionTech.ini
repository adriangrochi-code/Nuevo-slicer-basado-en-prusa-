[vendor]
repo_id = non-prusa-fff
name = eMotionTech
config_version = 1.0.0
config_update_url = 

[printer_model:I3 Metal Motion]
name = I3 Metal Motion
variants = 0.4
technology = FFF
family = eMotionTech
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[printer_model:IDEX420 Duplicate]
name = IDEX420 Duplicate
variants = 0.4
technology = FFF
family = eMotionTech
default_materials = Generic ABS @Orca; Generic PETG @Orca; Generic PLA @Orca

[print:*common @Cura_eMotionTech*]
