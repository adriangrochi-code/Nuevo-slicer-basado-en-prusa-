max_print_height = 400
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = reprapfirmware
retract_length = 6.5
retract_speed = 25
start_gcode = G90 ; switch to absolute coordinate mode\nT2 ; select the duplicate tool\nM140 S[first_layer_bed_temperature] ;Start heating bed\nM104 S[first_layer_temperature] ;Start heating extruder\nM190 S[first_layer_bed_temperature] ;Wait for bed to reach temp before proceeding\nM109 S[first_layer_temperature] ;Wait for extruder to reach temp before proceeding\nG1 F18000 Y-160 Z15 ; move fast to the coordinates\nG1 F18000 X0 Z0.3 ; move fast to the coordinates\nG92 E0 ; set the extruders to 0\nG1 F300 X60 E24 ; purge the hotends\nG1 F600 X40 ; swipe the nozzles\nG1 F600 Z3 ; perform Z hop
