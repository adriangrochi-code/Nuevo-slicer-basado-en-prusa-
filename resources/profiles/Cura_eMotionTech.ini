top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura eMotionTech 0.4]
inherits = *common @Cura_eMotionTech*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_EMOTIONTECH.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura eMotionTech 0.4]
inherits = *common @Cura_eMotionTech*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_EMOTIONTECH.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura eMotionTech 0.4]
inherits = *common @Cura_eMotionTech*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_EMOTIONTECH.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_eMotionTech*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:I3 Metal Motion 0.4 nozzle]
inherits = *common @Cura_eMotionTech*
printer_model = I3 Metal Motion
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_EMOTIONTECH\nCURA_DEFINITION_I3MetalMotion
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 200
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = reprapfirmware
retract_length = 6.5
retract_speed = 25
start_gcode = G21 ; set units to millimeters\nG90 ; use absolute positioning\nM83 ; relative extrusion (Tisma)\nM104 S[first_layer_temperature] ; set extruder temp\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nG28 W ; home all\nG92 E0.0 ; reset extruder distance position\nG1 Y-3.0 F1000.0 ; go outside print area\nG1 X60.0 E9.0 F1000.0 ; intro line\nG1 X100.0 E21.5 F1000.0 ; intro line\nG92 E0.0 ; reset extruder distance position
end_gcode = G28 Z\nG28 X\nG28 Y\nM107 ; Turn off the fan\nG91; Relative positioning\nG1 E-1 ; reduce filament pressure\nM104 T0 S0\nG90 ; Absolute positioning\nG92 E0 ; Reset extruder position\nM140 S0 ; Disable heated bed\nM84 ; Turn the steppers off
default_print_profile = 0.20mm Standard @Cura eMotionTech 0.4
default_filament_profile = Generic PLA @Orca

[printer:IDEX420 Duplicate 0.4 nozzle]
inherits = *common @Cura_eMotionTech*
printer_model = IDEX420 Duplicate
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_EMOTIONTECH\nCURA_DEFINITION_strateo3d_IDEX420_duplicate
