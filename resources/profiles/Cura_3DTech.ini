[vendor]
repo_id = non-prusa-fff
name = 3DTech
config_version = 1.0.1
config_update_url = 

[printer_model:3DTech Semi-Professional]
name = 3DTech Semi-Professional
variants = 0.4
technology = FFF
family = 3DTech
default_materials = Generic ABS @Orca @Template; Generic PETG @Orca @Template; Generic PLA @Orca @Template

[print:*common @Cura_3DTech*]
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 30
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
support_material_speed = 45
bridge_speed = 25
first_layer_speed = 20
travel_speed = 150
skirts = 1
skirt_distance = 3
brim_width = 0
support_material = 0
support_material_threshold = 45
support_material_contact_distance = 0.2
extrusion_width = 0
first_layer_extrusion_width = 0
seam_position = aligned
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode

[print:0.12mm Fine @Cura 3DTech 0.4]
inherits = *common @Cura_3DTech*
layer_height = 0.12
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_3DTECH.*/ and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Cura 3DTech 0.4]
inherits = *common @Cura_3DTech*
layer_height = 0.2
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_3DTECH.*/ and nozzle_diameter[0]==0.4

[print:0.28mm Draft @Cura 3DTech 0.4]
inherits = *common @Cura_3DTech*
layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_3DTECH.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_3DTech*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:3DTech Semi-Professional 0.4 nozzle]
inherits = *common @Cura_3DTech*
printer_model = 3DTech Semi-Professional
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_3DTECH\nCURA_DEFINITION_3dtech_semi_professional
bed_shape = 0x0,250x0,250x250,0x250
max_print_height = 300
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = G28 ; home all axes\nG29 ;\nG1 Z5 F3000 ; lift\nG1 X5 Y25 F5000 ; move to prime\nG1 Z0.2 F3000 ; get ready to prime\nG92 E0 ; reset extrusion distance\nG1 Y100 E20 F600 ; prime nozzle\nG1 Y140 F5000 ; quick wipe
end_gcode = M104 S0\nM140 S0 ; Retract the filament\nG92 E1\nG1 E-1 F300\nG28 X0 Y0\nM84
default_print_profile = 0.20mm Standard @Cura 3DTech 0.4
default_filament_profile = Generic PLA @Orca @Template
