[printer:BLACKBELT 3D Printer 15° 0.25 nozzle]
printer_technology = FFF
printer_notes = BELT_BLACKBELT_BLACKBELT_15\nBELT_PRINTER
gcode_flavor = marlin
belt_printer = 1
belt_angle = 15
belt_axis_z = 1
bed_shape = 0x0,340x0,340x1000,0x1000
max_print_height = 117.7627
use_relative_e_distances = 0
machine_limits_usage = time_estimate_only
single_extruder_multi_material = 0
extruder_colour = ""
wipe = 0
printer_model = BLACKBELT 3D Printer 15°
printer_variant = 0.25
nozzle_diameter = 0.25
min_layer_height = 0.05
max_layer_height = 0.1875
retract_length = 4
retract_speed = 65
retract_before_travel = 0.8
retract_lift = 0
machine_max_acceleration_x = 500
machine_max_acceleration_y = 500
start_gcode = ;start code BLACKBELT 3D Printer 3.6.2.2\n\nG90                             ; Set to Absolute Positioning\nM82                             ; Set extruder to absolute mode\nG21                             ; Metric values\nG92 X0 Y0 Z0 E0                 ; Set all axis to 0\n\n;home X and move Y dow\nG1 Y2                           ; Move Y axis off the bed\nG28                             ; Home X and move Y down\nG1 Y5                           ; Move Y axis up to prevent grinding on the belt\nG1 X170 Z5 F4000                ; Move X to the center\nM400                            ; Wait for this move to finish\n\n;probe Y\nM908 P5 S10                     ; Setting the motor current of the Y1 motor off\nM908 P1 S10                     ; Setting the motor current of the Y2 motor off\nG1 Y20 G3000                    ; Move Y up\nM400                            ; Wait for current moves to finish\nM908 P5 S20                     ; Setting the motor current of the Y1 motor very low\nM908 P1 S20                     ; Setting the motor current of the Y2 motor off\nG1 Y0 F500                      ; Move Y down into the belt\nM400                            ; Wait for current moves to finish\nM908 P5 S140                    ; Setting the motor current of the Y1 motor to normal\nM908 P1 S140                    ; Setting the motor current of the Y2 motor to normal\nG92 Y-0.8409\n\n;purge\nG1 Y3                           ; Move Y axis off the bed\nG1 E15                          ; Extruder 15mm material and move to the side\nG1 Z10 E20 F500                 ; Move belt 10mm and keep extruding\nG1 Z30                          ; Move the belt a bit further without extruding\nG92 Z0                          ; Zero Belt\nG92 E0                          ; Zero the extruded length\nG1 E-3 F3900                    ; Retract 3mm at 65mm/s\n\n;prepare printing\nG92 E-4.5                       ; Add 1.5mm start distance\nM117 BLACKBELT Printing...\n\n;˅˅˅˅˅˅˅˅˅˅˅˅˅˅˅˅ - copy from here / paste codes just under here - ˅˅˅˅˅˅˅˅˅˅˅˅˅˅˅˅\n\nM107                            ; Start with the fan off\n
end_gcode = ;end code BLACKBELT 3D Printer 3.6.2.2\n\nG92 E0                   ; Set Extruder to zero\nG92 Z0                   ; Set Belt to zero\nG1 E-3                   ; Retract 3mm\nG1 Z30                   ; Move Belt 30mm before starting up the next product\nG92 Z0                   ; Set Belt to zero again\n\nG1 Y100                  ; Move Y up to grease the linear bearing\n\nG1 X170 Y-0.8409\nG92 E0   ; Set Extruder to zero\n\n\n;˄˄˄˄˄˄˄˄˄˄˄˄˄˄˄˄ - copy up to here / paste codes just above here - ˄˄˄˄˄˄˄˄˄˄˄˄˄˄˄˄\n\nM104 S0                  ; Extruder heater off\nM140 S0                  ; Heated bed heater off\nM106 S0                  ; Part cooling fan off\nM106 P1 S0               ; Rear fan off\nG92 Z0                   ; Set belt to zero\nG1 Z30 F1000             ; Move the belt 30mm further\nG92 Z0                   ; Set belt to zero\nG1 X0 Y10 F2000          ; Move print head to the lower corner\nM18                      ; Disable all stepper motors\n\nM117 Printing done       ; Display a message on the screen\n
default_print_profile = 0.10mm Standard @BLACKBELT 3D 0.25
default_filament_profile = Generic PLA @Orca @Template

