layer_height = 0.28
first_layer_height = 0.2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_CURA_BQ.*/ and nozzle_diameter[0]==0.4

[printer:*common @Cura_BQ*]
printer_technology = FFF
use_relative_e_distances = 1
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
retract_lift = 0
retract_before_travel = 2
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0

[printer:BQ Hephestos 2 0.4 nozzle]
inherits = *common @Cura_BQ*
printer_model = BQ Hephestos 2
printer_variant = 0.4
printer_notes = PRINTER_VENDOR_CURA_BQ\nCURA_DEFINITION_bq_hephestos_2
bed_shape = 0x0,210x0,210x297,0x297
max_print_height = 220
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.3
gcode_flavor = marlin2
retract_length = 6.5
retract_speed = 25
start_gcode = ; -- START GCODE --\nM104 S[temperature]\nG28 ; Zero-ing position\nG29 ; Auto bed-leveling\nG0 X4 Y297 Z15 F4000 ; Fast move to BQ's start position\nG90 ; Set to Absolute Positioning\nG92 E0 ; Reset extruder 0\nG1 F1800 ; Set default feedrate\nM109 S[temperature] ; Makes sure the temperature is correct before printing\n; -- end of START GCODE --
end_gcode = ; -- END GCODE --\nM801        ; Marlin G-CODE to fire end print procedure\n; -- end of END GCODE --
default_print_profile = 0.20mm Standard @Cura BQ 0.4
default_filament_profile = Generic PLA @Orca @Template

[printer:BQ Prusa i3 Hephestos 0.4 nozzle]
inherits = *common @Cura_BQ*
