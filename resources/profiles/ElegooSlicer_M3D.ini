end_gcode = ; ===== ORCA END GCODE =====\nM400\nM83\nG92 E0\nG1 E-17 F1800           ; retract BEFORE any moves or power changes\n\n; Now lift and park\nG91\nG1 Z2 F2000\nG90\nG1 X100 Y160 F3000      ; parking point\n\n; Power down in order\nM104 T0 S0\nM104 T1 S0\nM106 S50                ; keep fan at ~50% while cooling (adjust if desired)\n; (Leave steppers on by omitting M84)\n; ===== END ORCA END GCODE =====\n
