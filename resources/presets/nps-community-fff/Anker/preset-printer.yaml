# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*Anker M5*'
condition: printer.model == "M5"
variants:
- condition: tool.nozzle_diameter == 0.4
  name: AnkerMake M5 (0.4 mm nozzle)
  id: zwGV/dJnW4uKboyryReVtA
  values:
    max_print_height: 250.0
    z_offset: 0.0
    single_extruder_multi_material: false
    gcode_flavor: marlin2
    thumbnails: 256x256
    silent_mode: false
    remaining_times: true
    use_relative_e_distances: true
    use_firmware_retraction: false
    use_volumetric_e: false
    variable_layer_height: true
    start_gcode: |
      M104 S{first_layer_temperature[0]} ; set final nozzle temp
      M190 S{first_layer_bed_temperature[0]} ; set and wait for bed temp to stabilize
      M109 S{first_layer_temperature[0]} ; wait for nozzle temp to stabilize
      G28 ;Home
      ;LAYER_COUNT:{total_layer_count}
    autoemit_temperature_commands: true
    end_gcode: |-
      M104 S0
      M140 S0
      ;Retract the filament
      G92 E1
      G1 E-1 F300
      G28 X0 Y0
      M84
    before_layer_gcode: |-
      ;BEFORE_LAYER_CHANGE
      ;{layer_z}
      ;LAYER:{layer_num+1}
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      G92 E0
    toolchange_gcode: ''
    between_objects_gcode: ''
    color_change_gcode: M600
    pause_print_gcode: M601
    template_custom_gcode: ''
    machine_limits_usage: time_estimate_only
    machine_max_feedrate_e:
    - 100.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 50.0
    machine_max_acceleration_e:
    - 10000.0
    machine_max_acceleration_extruding:
    - 10000.0
    machine_max_acceleration_retracting:
    - 10000.0
    machine_max_acceleration_travel:
    - 10000.0
    machine_max_acceleration_x:
    - 10000.0
    machine_max_acceleration_y:
    - 10000.0
    machine_max_acceleration_z:
    - 10000.0
    machine_max_jerk_x:
    - 15.0
    - 15.0
    machine_max_jerk_y:
    - 15.0
    - 15.0
    machine_max_jerk_z:
    - 0.3
    - 0.3
    machine_max_jerk_e:
    - 3.0
    - 3.0
    machine_min_extruding_rate:
    - 0.0
    - 0.0
    machine_min_travel_rate:
    - 0.0
    - 0.0
    extruder_offset:
    - '0x0'
    bed_shape:
    - '0x0'
    - 235-0
    - 235x235
    - '0x235'
    extruder_clearance_height: 30.0
    extruder_clearance_radius: 45.0
    default_print: 0.2 mm OPTIMAL (0.4 mm nozzle) @ANKER
