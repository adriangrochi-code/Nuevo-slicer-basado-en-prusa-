# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*BIQU BIQUBX*'
condition: printer.model == "BIQUBX"
variants:
- condition: tool.nozzle_diameter == 0.4
  name: BIQU BX
  id: FLQ+4/BhXbKYIV5ne8tsrw
  values:
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      ;{layer_z}

    between_objects_gcode: ''
    pause_print_gcode: ''
    extruder_offset:
    - '0x0'
    gcode_flavor: marlin2
    silent_mode: false
    remaining_times: false
    machine_max_acceleration_e:
    - 10000.0
    machine_max_acceleration_extruding:
    - 1000.0
    machine_max_acceleration_retracting:
    - 1000.0
    machine_max_acceleration_x:
    - 1000.0
    machine_max_acceleration_y:
    - 1000.0
    machine_max_acceleration_z:
    - 100.0
    machine_max_feedrate_e:
    - 65.0
    machine_max_feedrate_x:
    - 200.0
    machine_max_feedrate_y:
    - 200.0
    machine_max_feedrate_z:
    - 10.0
    machine_max_jerk_e:
    - 5.0
    machine_max_jerk_x:
    - 10.0
    machine_max_jerk_y:
    - 10.0
    machine_max_jerk_z:
    - 2.0
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;{layer_z}
    max_print_height: 250.0
    single_extruder_multi_material: false
    thumbnails: 16x16,220x124
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: false
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 34.0
    extruder_clearance_radius: 47.0
    start_gcode: |-
      M117 Initial homing sequence. ; Home so that the probe is positioned to heat
      G28

      M117 Probe heating position
      G0 X65 Y5 Z1 ; Move the probe to the heating position.

      M117 Getting the heaters up to temp!
      M104 S140 ; Set Extruder temperature, no wait
      M140 S[first_layer_bed_temperature] ; Set Heat Bed temperature
      M190 S[first_layer_bed_temperature] ; Wait for Heat Bed temperature

      M117 Waiting for probe to warm!
      G4 S90 ; Wait another 90s for the probe to absorb heat.

      M117 Post warming re-home
      G28 ; Home all axes again after warming

      M117 Z-Align
      G34

      M117 ABL Probing
      G29

      M900 K0 L0 T0 ; Edit the K and L values if you have calibrated a k factor for your filament
      M900 T0 S0

      G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
      G1 X4.1 Y10 Z0.3 F5000.0 ; Move to start position

      M117 Getting the extruder up to temp
      M140 S[first_layer_bed_temperature] ; Set Heat Bed temperature
      M104 S{first_layer_temperature[initial_tool]} ; Set Extruder temperature
      M109 S{first_layer_temperature[initial_tool]} ; Wait for Extruder temperature
      M190 S[first_layer_bed_temperature] ; Wait for Heat Bed temperature

      G92 E0 ; Reset Extruder
      M117 Purging
      G1 X4.1 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line
      G1 X4.4 Y200.0 Z0.3 F5000.0 ; Move to side a little
      G1 X4.4 Y20 Z0.3 F1500.0 E30 ; Draw the second line
      G92 E0 ; Reset Extruder
      M117 Printing...
      G1 X8 Y20 Z0.3 F5000.0 ; Move over to prevent blob squish
    end_gcode: |
      G91 ;Relative positioning
      G1 E-2 F2700 ;Retract a bit
      G1 E-2 Z0.2 F2400 ;Retract a bit more and raise Z
      G1 X5 Y5 F3000 ;Wipe out
      G1 Z10 ;Raise Z by 10mm
      G90 ;Return to absolute positioning

      G1 X0 Y{print_bed_max[1]*0.8} ;TaDaaaa
      M106 S0 ;Turn-off fan
      M104 S0 ;Turn-off hotend
      M140 S0 ;Turn-off bed

      M84 X Y E ;Disable all steppers but Z
    bed_shape:
    - '0x0'
    - 250x0
    - 250x250
    - '0x250'
    default_print: 0.20mm NORMAL @BIQU
