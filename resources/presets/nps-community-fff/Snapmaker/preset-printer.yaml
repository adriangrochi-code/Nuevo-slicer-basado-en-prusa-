      G92 E0

      M106 S{min(255, (max_fan_speed[1] + 10) * 2.55)}

      M104 S{first_layer_temperature[1] + 5}

      G1 E12.0 F200
      G92 E0
      G1 E8.0 Z4.6 F200
      G92 E0

      G0 Z5.6 F200
      M107

      G0 X{if 1 == 0}137.0{else}187.0{endif} F6840.0
      G0 Z0.3 F240.0
      M109 S{first_layer_temperature[1]} C3 W1
