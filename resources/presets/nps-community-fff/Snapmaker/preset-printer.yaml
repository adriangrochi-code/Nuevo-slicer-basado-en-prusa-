    - 5.0
    machine_max_jerk_y:
    - 1.0
    machine_max_jerk_z:
    - 1.0
    machine_max_jerk_e:
    - 3.0
    thumbnails: 300x150
    machine_max_feedrate_x:
    - 150.0
    machine_max_feedrate_y:
    - 150.0
    machine_max_feedrate_z:
    - 40.0
    machine_max_feedrate_e:
    - 45.0
    start_gcode: |-
      ; Model: Snapmaker A350 Dual ({nozzle_diameter[0]}/{nozzle_diameter[1]})
      ; Update: 20240428
      ; Maintained by https://github.com/macdylan/3dp-configs
      ; Printer : [printer_preset]
      ; Profile : [print_preset]
      ; Plate   : [physical_printer_preset]
      ; --- initial_extruder: [initial_extruder]
      ; --- has_wipe_tower: [has_wipe_tower]
      ; --- total_toolchanges: [total_toolchanges]
      ; --- T0: {is_extruder_used[0]}
      ; --- T1: {is_extruder_used[1]}

      M201 X[machine_max_acceleration_x] Y[machine_max_acceleration_y] Z[machine_max_acceleration_z] E[machine_max_acceleration_e]
      M203 X[machine_max_feedrate_x] Y[machine_max_feedrate_y] Z[machine_max_feedrate_z] E[machine_max_feedrate_e]
      M204 P[machine_max_acceleration_extruding] R[machine_max_acceleration_retracting] T[machine_max_acceleration_travel]
      M205 X[machine_max_jerk_x] Y[machine_max_jerk_y] Z[machine_max_jerk_z] E[machine_max_jerk_e]

      T[initial_extruder]

      M140 S{first_layer_bed_temperature[initial_extruder]}

      ; you can clean the nozzle
      {if is_extruder_used[0]}M104 T0 S165{endif}
      {if is_extruder_used[1]}M104 T1 S165{endif}
      M204 S100
      G28
      G0 Z190 F960.0
      G0 Y175.0 F3420.0
      G0 X160.0

      M190 R{first_layer_bed_temperature[initial_extruder]}

      G28
      {if 1==1}
        G0 X0
        G0 Z0.2 F960.0
        G0 Y0 F3420.0
        G0 X320
        G0 Y350
        G0 X0
        G0 Y0
      {endif}

      M83
      {if 1==1 && max(first_layer_bed_temperature[initial_extruder], bed_temperature[initial_extruder]) >= 90}
      G0 Z0.06 ;raise z to counteract thermal expansion
      G92 Z0 ;reset z
      {endif}

      {if is_extruder_used[0]}M104 T0 S{max(250, min(290, first_layer_temperature[0] + 15))}{endif}
      {if is_extruder_used[1]}M104 T1 S{max(250, min(290, first_layer_temperature[1] + 15))}{endif}

      {if is_extruder_used[0] and initial_extruder != 0}
        T0
      M104 S{max(250, min(290, first_layer_temperature[0] + 15))}; common flush temp
      G0 Z1.6 F960.0
      G0 X{if 0 == 0}145.0{else}175.0{endif} F3420.0
      G0 Y0 F3420.0

      M109 S{max(250, min(290, first_layer_temperature[0] + 15))} C2 W1; common flush temp
      G1 E20 F80.0
      G92 E0

      M106 S{min(255, (max_fan_speed[0] + 10) * 2.55)}

      M104 S{first_layer_temperature[0] + 5}

      G1 E12.0 F200
      G92 E0
      G1 E8.0 Z4.6 F200
      G92 E0

      G0 Z5.6 F200
      M107

      G0 X{if 0 == 0}100.0{else}220.0{endif} F3420.0
      G0 Z0.3 F960.0
      M109 S{first_layer_temperature[0]} C3 W1
      G1 E3 F200
      G92 E0
      G1 X{if 0 == 0}0{else}320{endif} E6.23628 F3420.0
      G92 E0

      G1 E-{retract_length_toolchange[0]} F200
      G92 E0
      G0 Y20 F3420.0

        M104 S{is_nil(idle_temperature[0]) ? temperature[0] + standby_temperature_delta : idle_temperature[0]}
      {endif}
      {if is_extruder_used[1] and initial_extruder != 1}
        T1
      M104 S{max(250, min(290, first_layer_temperature[1] + 15))}; common flush temp
      G0 Z1.6 F960.0
      G0 X{if 1 == 0}145.0{else}175.0{endif} F3420.0
      G0 Y0 F3420.0

      M109 S{max(250, min(290, first_layer_temperature[1] + 15))} C2 W1; common flush temp
      G1 E20 F80.0
      G92 E0

      M106 S{min(255, (max_fan_speed[1] + 10) * 2.55)}

      M104 S{first_layer_temperature[1] + 5}

      G1 E12.0 F200
      G92 E0
      G1 E8.0 Z4.6 F200
      G92 E0

      G0 Z5.6 F200
      M107

      G0 X{if 1 == 0}100.0{else}220.0{endif} F3420.0
      G0 Z0.3 F960.0
      M109 S{first_layer_temperature[1]} C3 W1
      G1 E3 F200
      G92 E0
      G1 X{if 1 == 0}0{else}320{endif} E6.23628 F3420.0
      G92 E0

      G1 E-{retract_length_toolchange[1]} F200
      G92 E0
      G0 Y20 F3420.0

        M104 S{is_nil(idle_temperature[1]) ? temperature[1] + standby_temperature_delta : idle_temperature[1]}
      {endif}

      T[initial_extruder]
      M104 S{max(250, min(290, first_layer_temperature[initial_extruder] + 15))}; common flush temp
      G0 Z1.6 F960.0
      G0 X{if initial_extruder == 0}145.0{else}175.0{endif} F3420.0
      G0 Y0 F3420.0

      M109 S{max(250, min(290, first_layer_temperature[initial_extruder] + 15))} C2 W1; common flush temp
      G1 E20 F80.0
      G92 E0

      M106 S{min(255, (max_fan_speed[initial_extruder] + 10) * 2.55)}

      M104 S{first_layer_temperature[initial_extruder] + 5}

      G1 E12.0 F200
      G92 E0
      G1 E8.0 Z4.6 F200
      G92 E0

      G0 Z5.6 F200
      M107

      G0 X{if initial_extruder == 0}100.0{else}220.0{endif} F3420.0
      G0 Z0.3 F960.0
      M109 S{first_layer_temperature[initial_extruder]} C3 W1
      G1 E3 F200
      G92 E0
      G1 X{if initial_extruder == 0}0{else}320{endif} E6.23628 F3420.0
      G92 E0

      G1 E-{retract_length[initial_extruder]} F200
      G92 E0
      G0 Y20 F3420.0

      ; ready [physical_printer_preset]
    end_gcode: |-
      G92 E0

      G0 Z{max_layer_z + 2.0} F600
      ; retract the filament to make it easier to replace
      G0 E-10 F200
      G28

          {if is_extruder_used[0]}M104 T0 S0{endif}
          {if is_extruder_used[1]}M104 T1 S0{endif}
      M140 S0
      M107
      M220 S100
      M84

      ;
      ; DON'T REMOVE these lines if you're using the smfix (https://github.com/macdylan/SMFix)
      ; min_x = [first_layer_print_min_0]
      ; min_y = [first_layer_print_min_1]
      ; max_x = [first_layer_print_max_0]
      ; max_y = [first_layer_print_max_1]
      ; max_z = [max_layer_z]
      ; total_layer_number = [layer_num]
      ;
    toolchange_gcode: |-
      ;***** Update: 20231010
      {if current_extruder != next_extruder }
      ; Change T[current_extruder] -> T[next_extruder] (layer:[layer_num] tc:[total_toolchanges])
      {if has_wipe_tower}
      G1 E-{retract_length_toolchange[current_extruder]} X{wipe_tower_x} Y{wipe_tower_y} F{travel_speed*60}
      {else}
      G1 E-{retract_length_toolchange[current_extruder]} F{retract_speed[current_extruder]*60}
      {endif}
      T{next_extruder}

      M107 P[current_extruder] ;fan off T[current_extruder]
      M104 T[current_extruder] S{is_nil(idle_temperature[current_extruder]) ? temperature[current_extruder] + standby_temperature_delta : idle_temperature[current_extruder]} ;standby T[current_extruder]

      {if layer_num == 1 &&
       ((filament_type[current_extruder] == "PLA" || filament_type[current_extruder] == "TPU")
        || (filament_type[next_extruder] == "PLA" || filament_type[next_extruder] == "TPU"))
      }
      ; set bed temp: {filament_type[current_extruder]}({bed_temperature[current_extruder]}) -> {filament_type[next_extruder]}({bed_temperature[next_extruder]})
      M140 S{min(bed_temperature[current_extruder], bed_temperature[next_extruder])}
      {endif}

      M109 T[next_extruder] S{layer_num < 1 ? first_layer_temperature[next_extruder] : temperature[next_extruder]} C3 W1 ;wait T{next_extruder}
      {if layer_num >= disable_fan_first_layers[next_extruder]}
        M106 P[next_extruder] S{min_fan_speed[next_extruder] * 255.0 / 100.0} ; restore fan speed for T[next_extruder]
      {endif}
      G1 E{retract_length_toolchange[next_extruder]} F100

      {if layer_z <= (first_layer_height + 0.001)}
        M204 S[first_layer_acceleration] ;first layer accel
      {elsif default_acceleration > 0}
        M204 S[default_acceleration] ;default accel
      {endif}

      {endif}
    before_layer_gcode: |-
      ; layer: [layer_num]
      G92 E0
    bed_shape:
    - '0x0'
    - 320x0
    - 320x350
    - '0x350'
    max_print_height: 285.0
    default_print: 0.24 Standard @Snapmaker (0.8 nozzle)
