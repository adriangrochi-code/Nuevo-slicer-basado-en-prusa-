      G0 Z1.6 F960.0
      G0 X{if 0 == 0}185.0{else}215.0{endif} F6840.0
      G0 Y0 F6840.0

      M109 S{max(250, min(290, first_layer_temperature[0] + 15))} C2 W1; common flush temp
      G1 E20 F80.0
      G92 E0

