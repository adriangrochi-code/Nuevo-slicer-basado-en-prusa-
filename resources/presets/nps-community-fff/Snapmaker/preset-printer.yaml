      M109 S{first_layer_temperature[initial_extruder]} C3 W1
      G1 E3 F200
      G92 E0
      G1 X{if initial_extruder == 0}0{else}320{endif} E6.23628 F3420.0
      G92 E0

      G1 E-{retract_length[initial_extruder]} F200
      G92 E0
      G0 Y20 F3420.0

