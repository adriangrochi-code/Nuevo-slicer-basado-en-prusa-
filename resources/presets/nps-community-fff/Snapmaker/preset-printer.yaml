  name: Snapmaker A250 Dual (0.2 nozzle)
  id: YNk3UUGSUkq09X/+43dmDw
  values:
    gcode_flavor: marlin2
    use_relative_e_distances: true
    silent_mode: false
    remaining_times: true
    single_extruder_multi_material: false
    cooling_tube_retraction: 0.0
