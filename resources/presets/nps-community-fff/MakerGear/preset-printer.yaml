      T1 ; makes sure T1 is active
      G90 ; switch into absolute mode
      G1 X252
      T0
      {endif}

      {if next_extruder == 1}
      T0 ; makes sure T0 is active
      G90 ; switch into absolute mode
      G1 X-20.77
      T1
      {endif}
    default_print: 0.20mm Quality @0.50 nozzle MakerGear
