t_layer_temperature[0]}\nM109 T1 S{first_layer_temperature[1]}\n\nM116 ; Wait for all hotends to reach operation temperature (this will wait for cooldown if there is overshoot)\n\n; Purge Scripts\n{if temperature[1] == 0}\n; U1 Single Mode - Left Purge\nT0 \t\t    ; implied by G28 but explicilty called here\nG1 Z20.0 F6000      ; Move Z to 20\nG92 E0              ; Zero Extruder\nM564 S0 \t    ; Safteys off\nG1 X160 Y5 F1000    ; Move to unused front edge\nG1 Z0.30 F1000      ; Move closer to the bed\nG1 X40 E20 F1000    ; Deposit purge line\nG1 X30 Z0.05 F1000  ; Wipe off tail\nG1 Z10\t\t    ; Move away from bed\nG1 Y11 \t\t    ; Move to Y-axis safe zone\nG92 E0 \t            ; Zero extruder\nM564 S0 \t    ; Safteys off\nM106 P2 S50         ; Enable exhaust fan\n{endif}\n\n{if temperature[0] == 0}\n; U1 Single Mode - Right Purge\nT1\t\t    ; Switch to T1\nG1 Z20.0 F6000      ; Move Z to 20\nG92 E0              ; Zero Extruder\nM564 S0 \t    ; Safteys off\nG1 X160 Y5 F1000    ; Move to unused front edge\nG1 Z0.30 F1000      ; Move closer to the bed\nG1 X40 E20 F1000    ; Deposit purge line\nG1 X30 Z0.05 F1000  ; Wipe off tail\nG1 Z10\t\t    ; Move away from bed\nG1 Y11 \t\t    ; Move to y safe zone\nG92 E0 \t\t    ; Zero extruder\nM564 S0             ; Safteys off\nM106 P2 S50         ; Enable exhaust fan\n{endif}\n\n{if temperature[0] > 0 && temperature[1] > 0}\n; U1 T0/T1 Startup Script\nT1 \t\t    ; Switch to T1\nG1 Z20.0 F6000      ; Move Z to 20\nG92 E0              ; Zero Extruder\nM564 S0 \t    ; Safteys off\nG1 X160 Y5 F1000    ; Move to unused front edge\nG1 Z0.30 F1000      ; Move closer to the bed\nG1 X40 E20 F1000    ; Deposit purge line\nG1 X30 Z0.05 F1000  ; Wipe off tail\nG1 Z10\t\t    ; Move away from bed\nG1 Y11 \t\t    ; Move to y safe zone\nG92 E0 \t\t    ; Zero extruder\n\nT0\t\t    ; Switch to T0\nG1 X360 Y5 F1000    ; Move to unused front edge\nG1 Z0.30 F1000      ; Move closer to the bed\nG1 X240 E20 F1000   ; Deposit purge line\nG1 X230 Z0.05 F1000 ; Wipe off tail\nG1 Z10\t\t    ; Move away from bed\nG1 Y11 \t\t    ; Move to y safe zone\n\
      G92 E0 \t\t    ; Zero extruder\nM564 S1 \t    ; Safteys on\nM106 P2 S50         ; Enable exhaust fan\n{endif}"
