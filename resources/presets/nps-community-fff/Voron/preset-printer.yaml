# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*Voron V2_250*'
condition: printer.model == "V2_250"
variants:
- condition: tool.nozzle_diameter == 0.4 and tool.nozzle_high_flow
  name: VORON V2 250mm - 0.4mm Nozzle (High Flow)
  id: YnFMn+zVV4mOJOwOqgrEvw
  values:
    autoemit_temperature_commands: false
    before_layer_gcode: |-
      ;BEFORE_LAYER_CHANGE
      G92 E0
      ;{layer_z}
    binary_gcode: false
    color_change_gcode: M600
    cooling_tube_length: 20.0
    cooling_tube_retraction: 45.0
    end_gcode: PRINT_END
    extra_loading_move: -52.0
    extruder_clearance_height: 33.0
    extruder_clearance_radius: 75.0
    extruder_offset:
    - '0x0'
    gcode_flavor: klipper
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;{layer_z}
    machine_limits_usage: time_estimate_only
    machine_max_acceleration_e:
    - 5000.0
    - 2500.0
    machine_max_acceleration_extruding:
    - 7000.0
    - 2500.0
    machine_max_acceleration_retracting:
    - 2500.0
    - 2500.0
    machine_max_acceleration_travel:
    - 7000.0
    - 2500.0
    machine_max_acceleration_x:
    - 10000.0
    - 2500.0
    machine_max_acceleration_y:
    - 10000.0
    - 2500.0
    machine_max_acceleration_z:
    - 400.0
    - 200.0
    machine_max_feedrate_e:
    - 100.0
    - 100.0
    machine_max_feedrate_x:
    - 350.0
    - 175.0
    machine_max_feedrate_y:
    - 350.0
    - 175.0
    machine_max_feedrate_z:
    - 15.0
    - 15.0
    machine_max_jerk_e:
    - 10.0
    - 10.0
    machine_max_jerk_x:
    - 10.0
    - 8.0
    machine_max_jerk_y:
    - 10.0
    - 8.0
    machine_max_jerk_z:
    - 2.0
    - 2.0
    machine_min_extruding_rate:
    - 0.0
    - 0.0
    machine_min_travel_rate:
    - 0.0
    - 0.0
    multimaterial_purging: 140.0
    parking_pos_retraction: 84.0
    pause_print_gcode: PAUSE
    remaining_times: true
    silent_mode: false
    single_extruder_multi_material: false
    start_gcode: |-
      ; @see https://github.com/jontek2/A-better-print_start-macro for the macro
      PRINT_START EXTRUDER=[first_layer_temperature[initial_extruder]] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature] CHAMBER_MINIMAL=[chamber_minimal_temperature]
    thumbnails: 32x32/PNG, 300x300/PNG, 400x300/PNG
    use_relative_e_distances: true
    variable_layer_height: true
    bed_shape:
    - '0x0'
    - 250x0
    - 250x250
    - '0x250'
    max_print_height: 210.0
    default_print: 0.20mm Standard @VORON2 - HF0.4mm
