    - '0x0'
    - 20x0
    gcode_flavor: marlin
    silent_mode: false
    remaining_times: false
    machine_max_acceleration_e:
    - 1000.0
    machine_max_acceleration_extruding:
    - 2000.0
    machine_max_acceleration_retracting:
    - 1500.0
    machine_max_acceleration_x:
    - 800.0
    machine_max_acceleration_y:
    - 800.0
    machine_max_acceleration_z:
    - 15.0
    machine_max_feedrate_e:
    - 120.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 10.0
    machine_max_jerk_e:
    - 2.5
    machine_max_jerk_x:
    - 10.0
    machine_max_jerk_y:
    - 10.0
    machine_max_jerk_z:
    - 0.4
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;[layer_z]
    single_extruder_multi_material: false
    thumbnails: 95x95
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 20.0
    extruder_clearance_radius: 20.0
    start_gcode: |-
      G90
      G28
      M420 Z20
      G1 Z5 F5000
      M218 T1 X20 Y0 ; Set second extruder offset
    end_gcode: |-
      M104 S0 T0 ; turn off temperature
      M104 S0 T1 ; turn off 2nd extruder
      M140 S0 ; turn off heatbed
      M107 ; turn off fan
      {if layer_z < max_print_height}G1 Z{z_offset+min(layer_z+5, max_print_height)} F600{endif} ; Move print head up
      G1 X5 Y170 F3000 ; present print
      {if layer_z < max_print_height-10}G1 Z{z_offset+min(layer_z+70, max_print_height-10)} F600{endif} ; Move print head up
      M84 X Y E ; disable motors
    bed_shape:
    - '0x0'
    - 457x0
    - 457x457
    - '0x457'
    max_print_height: 610.0
