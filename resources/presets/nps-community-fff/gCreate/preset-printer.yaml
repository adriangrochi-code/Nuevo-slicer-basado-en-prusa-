kind: printer
id: '*gCreate GMAX2*'
condition: printer.model == "GMAX2"
variants:
- condition: tool.nozzle_diameter == 0.3
  name: gMax 2 - 0.3mm nozzle
  id: rgm2FZlVUaO2J83GfwPvnQ
  values:
