  name: gMax 2 Dual Chimera - 0.5, 0.5mm nozzle
  id: 4P+L7FOVVcKlGGLR8v5nIQ
  values:
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      G92 E0
      ;[layer_z]

