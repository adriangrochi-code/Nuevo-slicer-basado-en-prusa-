      G1 X5.4 Y20 Z0.28 F1500.0 E30 ;Draw the second line
      G92 E0 ;Reset Extruder
      G1 Z2.0 F3000 ;Move Z Axis up
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 20.0
    extruder_clearance_radius: 45.0
    color_change_gcode: |-
      M600
      G1 E0.4 F1500 ; prime after color change
    thumbnails: 160x120
    default_print: 0.20mm SPEED @SV06
