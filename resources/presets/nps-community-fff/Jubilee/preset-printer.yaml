# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*Jubilee Jubilee*'
condition: printer.model == "Jubilee"
variants:
- condition: tool.nozzle_diameter == 0.4 and ! tool.nozzle_high_flow
  name: Jubilee
  id: PCIr00yRWGGsDBUcnTmmYw
  values:
    bed_shape:
    - '0x0'
    - 300x0
    - 300x300
    - '0x300'
    cooling_tube_length: 5.0
    cooling_tube_retraction: 91.5
    end_gcode: |
      T-1         ; desect current tool
      G0 Z305  ; move bed all the way to the bottom
      M104 S0 T0; turn off extruder 0
      M104 S0 T1; turn off extruder 1
      M140 S0 ; turn off bed
      G0 X0 Y0 F30000; return home
      M84 S600; disable motors after ten mins of inactivity
    extra_loading_move: -2.0
    extruder_offset:
    - '0x0'
    - '0x0'
    gcode_flavor: marlin
    high_current_on_filament_swap: false
    layer_gcode: ''
    machine_max_acceleration_e:
    - 1500.0
    machine_max_acceleration_extruding:
    - 1500.0
    machine_max_acceleration_retracting:
    - 1500.0
    machine_max_acceleration_x:
    - 1000.0
    machine_max_acceleration_y:
    - 1000.0
    machine_max_acceleration_z:
    - 20.0
    machine_max_feedrate_e:
    - 8000.0
    machine_max_feedrate_x:
    - 13000.0
    machine_max_feedrate_y:
    - 13000.0
    machine_max_feedrate_z:
    - 800.0
    machine_max_jerk_e:
    - 50.0
    machine_max_jerk_x:
    - 17.0
    machine_max_jerk_y:
    - 17.0
    machine_max_jerk_z:
    - 0.1
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    machine_limits_usage: time_estimate_only
    max_print_height: 300.0
    parking_pos_retraction: 92.0
    remaining_times: false
    silent_mode: false
    single_extruder_multi_material: false
    start_gcode: |-
      G91 ; relative moves
      G1 Z1 F900 ; raise tool 1mm
      G90 ; absolute moves
      T-1 ; Make sure nothing is parked on the carriage
      G0 X150 Y150 F10000; Move to the center of the print area
      M558 F500  ; Set the probing speed
      G30 ; Do a single probe
      M558 F50 ; Set a slower probing speed
      G30 ; Do a second probe
      T[current_extruder]
    thumbnails: ''
    toolchange_gcode: T[next_extruder]
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: false
    z_offset: 0.0
    before_layer_gcode: |-
      ;BEFORE_LAYER_CHANGE
      G92 E0
    default_print: 0.2mm V6
