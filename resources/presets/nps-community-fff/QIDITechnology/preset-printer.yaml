      G1 E-2 F1800
      ; FLUSH_END

      G1 Y300 F1000
      MOVE_TO_TRASH
      G1 Y300 F9000
      CLEAR_FLUSH
      CLEAR_OOZE


      ; FLUSH_START
      G1 E{48.5 * 0.58} F{min(filament_max_volumetric_speed[current_extruder], filament_max_volumetric_speed[next_extruder]) / 2.4 * 60}
      G1 E{48.5 * 0.02} F{min(filament_max_volumetric_speed[current_extruder], filament_max_volumetric_speed[next_extruder]) / 2.4 * 60}
      G1 E{48.5 * 0.18} F{min(filament_max_volumetric_speed[current_extruder], filament_max_volumetric_speed[next_extruder]) / 2.4 * 60}
      G1 E{48.5 * 0.02} F{min(filament_max_volumetric_speed[current_extruder], filament_max_volumetric_speed[next_extruder]) / 2.4 * 60}
      G1 E{48.5 * 0.18} F{min(filament_max_volumetric_speed[current_extruder], filament_max_volumetric_speed[next_extruder]) / 2.4 * 60}
      G1 E{48.5 * 0.02} F{min(filament_max_volumetric_speed[current_extruder], filament_max_volumetric_speed[next_extruder]) / 2.4 * 60}
