# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*QIDITechnology X-Plus 4*'
condition: printer.model == "X-Plus 4"
variants:
- condition: tool.nozzle_diameter == 0.2
  name: X-Plus 4 0.2 nozzle
  id: +hF0naJXU8a0yneJHtRsjw
  values:
    autoemit_temperature_commands: false
    extruder_clearance_height: 40.0
    extruder_clearance_radius: 60.0
    bed_custom_model: ''
    bed_custom_texture: ''
    bed_shape:
    - '0x0'
    - 305x0
    - 305x305
    - '0x305'
    before_layer_gcode: TIMELAPSE_TAKE_FRAME
    between_objects_gcode: ''
    binary_gcode: false
    color_change_gcode: M0
    cooling_tube_length: 5.0
    cooling_tube_retraction: 91.5
    end_gcode: |-
      M141 S0
      M104 S0
      M140 S0
      G1 E-3 F1800
      G0 Z{min(max_print_height, max_layer_z + 3)} F600
      G0 X0 Y0 F12000
      {if max_layer_z < max_print_height / 2}G1 Z{max_print_height / 2 + 10} F600{else}G1 Z{min(max_print_height, max_layer_z + 3)}{endif}
    extra_loading_move: -2.0
    extruder_offset:
    - '0x0'
    gcode_flavor: klipper
    high_current_on_filament_swap: false
    layer_gcode: |-
      G92 E0
      SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
    machine_limits_usage: time_estimate_only
    machine_max_acceleration_e:
    - 5000.0
    machine_max_acceleration_extruding:
    - 20000.0
    machine_max_acceleration_retracting:
    - 5000.0
    machine_max_acceleration_travel:
    - 1500.0
    machine_max_acceleration_x:
    - 20000.0
    machine_max_acceleration_y:
    - 20000.0
    machine_max_acceleration_z:
    - 500.0
    machine_max_feedrate_e:
    - 30.0
    machine_max_feedrate_x:
    - 600.0
    machine_max_feedrate_y:
    - 600.0
    machine_max_feedrate_z:
    - 20.0
    machine_max_jerk_e:
    - 2.0
    machine_max_jerk_x:
    - 9.0
    machine_max_jerk_y:
    - 9.0
    machine_max_jerk_z:
    - 3.0
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    max_print_height: 280.0
    multimaterial_purging: 45.0
    parking_pos_retraction: 0.0
    pause_print_gcode: M0
    remaining_times: true
    silent_mode: false
    single_extruder_multi_material: false
    start_gcode: |
      PRINT_START BED=[first_layer_bed_temperature] HOTEND=[first_layer_temperature] CHAMBER=[chamber_temperature]
      SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]
      M83
      M140 S[first_layer_bed_temperature]
      M104 S[first_layer_temperature]
      G4 P3000
      G0 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0)} Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0)} Z5 F6000
      G0 Z[first_layer_height] F600
      G1 E3 F1800
      G1 X{(min(print_bed_max[0], first_layer_print_min[0] + 80))} E{85 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      G1 Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0) + 2} E{2 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0)} E{85 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      G1 Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0) + 85} E{83 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0) + 2} E{2 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      G1 Y{max((min(print_bed_max[1], first_layer_print_min[1] + 80) - 85),0) + 3} E{82 * 0.5 * first_layer_height * nozzle_diameter[0]} F3000
      G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0) + 3} Z0
      G1 X{max((min(print_bed_max[0], first_layer_print_min[0] + 80) - 85),0) + 6}
      G1 Z1 F600
      SET_PRINT_STATS_INFO CURRENT_LAYER=1
    template_custom_gcode: ''
    thumbnails: 272x272/PNG, 96x96/PNG
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    default_print: 0.12mm Fine @X-Plus 4 0.2 nozzle
