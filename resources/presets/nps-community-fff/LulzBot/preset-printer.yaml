# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*LulzBot MINI_AERO*'
condition: printer.model == "MINI_AERO"
variants:
- condition: tool.nozzle_diameter == 0.5
  name: Mini Aero 0.5mm
  id: TCzZr7xFWoOQZLXGmIYw7A
  values:
    bed_shape:
    - '0x0'
    - 154x0
    - 154x154
    - '0x154'
    before_layer_gcode: ''
    between_objects_gcode: ''
    cooling_tube_length: 5.0
    cooling_tube_retraction: 91.5
    end_gcode: "M400                                      ; wait for moves to finish\nM140 S40 ; start bed cooling\nM104 S0                                   ; disable hotend\nM107                                      ; disable fans\nG92 E1                                    ; set extruder to 1mm for retract on print end (LulzBot Cura had 5mm, might be a contributing factor to between print Aerostruder jamming)\nM117 Cooling please wait                  ; progress indicator message on LCD\nG1 X5 Y5 Z158 E0 F10000                   ; move to cooling position\nG1 E1                                     ; re-prime extruder\nM190 R40 ; wait for bed to cool down to removal temp\nM77\t\t\t\t\t  ; Stop GLCD Timer\nG1 X145 F1000                             ; move extruder out of the way\nG1 Y175 F1000                             ; present finished print\nM140 S0; cool downs\nM84                                       ; disable steppers\nG90                                       ; absolute positioning\nM117 Print Complete.                      ; print complete message\n"
    extra_loading_move: -2.0
    extruder_offset:
    - '0x0'
    gcode_flavor: marlin
    high_current_on_filament_swap: false
    layer_gcode: ''
    machine_max_acceleration_e:
    - 10000.0
    machine_max_acceleration_extruding:
    - 1500.0
    machine_max_acceleration_retracting:
    - 1500.0
    machine_max_acceleration_x:
    - 9000.0
    machine_max_acceleration_y:
    - 9000.0
    machine_max_acceleration_z:
    - 100.0
    machine_max_feedrate_e:
    - 40.0
    machine_max_feedrate_x:
    - 300.0
    machine_max_feedrate_y:
    - 300.0
    machine_max_feedrate_z:
    - 8.0
    machine_max_jerk_e:
    - 2.5
    machine_max_jerk_x:
    - 20.0
    machine_max_jerk_y:
    - 20.0
    machine_max_jerk_z:
    - 0.2
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    machine_limits_usage: time_estimate_only
    max_print_height: 158.0
    parking_pos_retraction: 92.0
    remaining_times: false
    silent_mode: false
    single_extruder_multi_material: false
    start_gcode: |-
      ;This G-Code has been generated specifically for the LulzBot Mini with Aerosturder
      M73 P0 ; clear GLCD progress bar
      M75 ; start GLCD timer
      G26 ; clear potential 'probe fail' condition
      M107 ; disable fans
      M420 S0 ; disable leveling matrix
      G90 ; absolute positioning
      M82 ; set extruder to absolute mode
      G92 E0 ; set extruder position to 0
      M140 S{first_layer_bed_temperature[0]} ; start bed heating up
      G28; home all axes
      G0 X0 Y187 Z156 F200 ; move away from endstops
      M109 R{first_layer_temperature[0] - 60} ; soften filament before retraction
      ;G1 E-15 F75 ; retract filament (LulzBot Cura is apparently trying to cold pull, might be a contributing factor to hob gear filling with filament)
      M109 R{first_layer_temperature[0] - 60} ; wait for extruder to reach wiping temp
      G1 X45 Y173 F11520 ; move above wiper pad
      G1 Z0 F1200 ; push nozzle into wiper
      G1 X42 Y173 Z-.5 F4000 ; wiping
      G1 X52 Y171 Z-.5 F4000 ; wiping
      G1 X42 Y173 Z0 F4000 ; wiping
      G1 X52 Y171 F4000 ; wiping
      G1 X42 Y173 F4000 ; wiping
      G1 X52 Y171 F4000 ; wiping
      G1 X42 Y173 F4000 ; wiping
      G1 X52 Y171 F4000 ; wiping
      G1 X57 Y173 F4000 ; wiping
      G1 X77 Y171 F4000 ; wiping
      G1 X57 Y173 F4000 ; wiping
      G1 X77 Y171 F4000 ; wiping
      G1 X57 Y173 F4000 ; wiping
      G1 X87 Y171 F4000 ; wiping
      G1 X77 Y173 F4000 ; wiping
      G1 X97 Y171 F4000 ; wiping
      G1 X77 Y173 F4000 ; wiping
      G1 X97 Y171 F4000 ; wiping
      G1 X77 Y173 F4000 ; wiping
      G1 X97 Y171 F4000 ; wiping
      G1 X107 Y173 F4000 ; wiping
      G1 X97 Y171 F4000 ; wiping
      G1 X107 Y173 F4000 ; wiping
      G1 X97 Y171 F4000 ; wiping
      G1 X107 Y173 F4000 ; wiping
      G1 X112 Y171 Z-0.5 F1000 ; wiping
      G1 Z10 ; raise extruder
      G28 X0 Y0 ; home X and Y
      G0 X0 Y187 F200 ; move away from endstops
      M109 R{first_layer_temperature[0] - 60} ; wait for extruder to reach probe temp
      M204 S300 ; set probing acceleration
      G29       ; start auto-leveling sequence
      M420 S1   ; enable leveling matrix
      M425 Z    ; use measured Z backlash for compensation
      M425 Z F0 ; turn off measured Z backlash compensation. (if activated in the quality settings, this command will automatically be ignored)
      M204 S2000 ; restore standard acceleration
      G28 X0 Y0 ; re-home to account for build variance of earlier mini builds
      G0 X0 Y187 F200 ; move away from endstops
      G0 Y152 F4000 ; move in front of wiper pad
      G4 S1 ; pause
      M400 ; wait for moves to finish
      M117 Heating... ; progress indicator message on LCD
      M109 R{first_layer_temperature[0]}  ; wait for extruder to reach printing temp
      M190 R{first_layer_bed_temperature[0]} ; wait for bed to reach printing temp
      G1 Z2 E0 F75 ; prime tiny bit of filament into the nozzle
      M117 Mini Printing... ; progress indicator message on LCD
      M221 S74 ; Printer specific extrusion modifier.
    thumbnails: ''
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: false
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    default_print: 0.25mm STANDARD @lulzbot
