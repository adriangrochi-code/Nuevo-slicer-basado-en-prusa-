  values:
    autoemit_temperature_commands: false
    color_change_gcode: M600
    gcode_flavor: reprapfirmware
    high_current_on_filament_swap: false
    machine_limits_usage: time_estimate_only
    machine_max_acceleration_e:
    - 2400.0
    machine_max_acceleration_extruding:
    - 5000.0
    machine_max_acceleration_retracting:
    - 5000.0
    machine_max_acceleration_travel:
    - 5000.0
    machine_max_acceleration_x:
    - 5000.0
    machine_max_acceleration_y:
    - 5000.0
    machine_max_acceleration_z:
    - 300.0
    machine_max_feedrate_e:
    - 100.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 10.0
    machine_max_jerk_e:
    - 15.0
    machine_max_jerk_x:
    - 4.0
    machine_max_jerk_y:
    - 4.0
    machine_max_jerk_z:
    - 2.5
    max_print_height: 1000.0
    parking_pos_retraction: 92.0
    pause_print_gcode: M226
    remaining_times: true
    silent_mode: false
    single_extruder_multi_material: false
    thumbnails: 256x256/QOI
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 90.0
    extruder_clearance_radius: 95.0
    end_gcode: |
      ; Stop the print
      M0

      ;NUM_LAYERS:[total_layer_count]
    before_layer_gcode: ;LAYER:[layer_num]
    bed_shape:
    - '0x0'
    - 650x0
    - 650x640
    - '0x640'
    extruder_offset:
    - '0x0'
    - '0x0'
    toolchange_gcode: |-
      T{next_extruder}
      M116 P{next_extruder} S5
    layer_gcode: '{if layer_num == 1}M140 S{max((is_extruder_used[0]? bed_temperature[0]:0),(is_extruder_used[1]? bed_temperature[1]:0))}{endif}'
    start_gcode: |
      ; Run nozzle diameter and filament check
      M98 P{"{directories.system^\"/System Macros/Config Checks/nozzle_check.g\"}"} {if is_extruder_used[0]}L{nozzle_diameter[0]}{endif} {if is_extruder_used[1]}S{nozzle_diameter[1]}{endif}
      M98 P{"{directories.system^\"/System Macros/Config Checks/filament_check.g\"}"} {if is_extruder_used[0]}{if filament_notes[0] == ""}L"{filament_type[0]}"{else}A"{filament_notes[0]}"{endif}{endif} {if is_extruder_used[1]}{if filament_notes[1] == ""}S"{filament_type[1]}"{else}B"{filament_notes[1]}"{endif}{endif}

      ; set extruder temp
      {if is_extruder_used[0]}M568 P0 S{first_layer_temperature[0]} R{(!is_nil(idle_temperature[0])? idle_temperature[0]:first_layer_temperature[0]-60)} A1{endif}
      {if is_extruder_used[1]}M568 P1 S{first_layer_temperature[1]} R{(!is_nil(idle_temperature[1])? idle_temperature[1]:first_layer_temperature[1]-60)} A1{endif}

      ; Set and wait for bed temp
      M190 S{max((is_extruder_used[0]? first_layer_bed_temperature[0]:0),(is_extruder_used[1]? first_layer_bed_temperature[1]:0))}

      ; Home all axes
      G28

      ; Enable mesh compensation
      M98 P{"{directories.system^\"/System Macros/Config Checks/load_heightmap.g\"}"}

      ; Move to starting position
      G0 H2 X{"{move.axes[0].min}"} Y50 F6000

      ; Select first tool
      T{initial_extruder}

      ; Move near start
      G1 X[first_layer_print_min_0] Y[first_layer_print_min_1] Z{first_layer_height + 2.0} F12000
    default_print: 300 Micron Standard @HSP1
