# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*Infinity3D DEV-200*'
condition: printer.model == "DEV-200"
variants:
- condition: tool.nozzle_diameter == 0.4
  name: Infinity3D DEV-200
  id: TmqHNOL2W127qiUFSpKqDg
  values:
    bed_shape:
    - '0x0'
    - 200x0
    - 200x200
    - '0x200'
    color_change_gcode: M600
    cooling_tube_length: 5.0
    cooling_tube_retraction: 91.5
    end_gcode: |-
      ;End GCode begin
      M140 S0 ;Heated bed heater off
      M104 S0 ;Extruder heater off
      G90 ;absolute positioning
      G92 E0 ;Retract the filament
      G1 E-1 F300 ;retract the filament a bit before lifting the nozzle, to release some of the pressure
      G1 Z240 E-1 F3000 ;move Z up a bit and retract filament even more
      G1 X0 F3000 ;move X to min endstops, so the head is out of the way
      G1 Y200 F3000 ;so the head is out of the way and Plate is moved forward
      M84 ;stepper off
      M107 ; fan off
      M82 ; absolute extrusion
      ;End GCode end
    extra_loading_move: -2.0
    extruder_offset:
    - '0x0'
    gcode_flavor: marlin
    high_current_on_filament_swap: false
    machine_limits_usage: time_estimate_only
    machine_max_acceleration_e:
    - 10000.0
    machine_max_acceleration_extruding:
    - 1000.0
    machine_max_acceleration_retracting:
    - 1000.0
    machine_max_acceleration_travel:
    - 1500.0
    machine_max_acceleration_x:
    - 3000.0
    machine_max_acceleration_y:
    - 3000.0
    machine_max_acceleration_z:
    - 100.0
    machine_max_feedrate_e:
    - 25.0
    machine_max_feedrate_x:
    - 150.0
    machine_max_feedrate_y:
    - 150.0
    machine_max_feedrate_z:
    - 50.0
    machine_max_jerk_e:
    - 2.5
    machine_max_jerk_x:
    - 10.0
    machine_max_jerk_y:
    - 10.0
    machine_max_jerk_z:
    - 0.2
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    max_print_height: 235.0
    parking_pos_retraction: 92.0
    pause_print_gcode: ''
    remaining_times: false
    silent_mode: false
    single_extruder_multi_material: false
    start_gcode: |-
      Start GCode begin
      M140 S[first_layer_bed_temperature] ;Start Warming Bed
      M104 S[first_layer_temperature] ;Preheat
      G28 ;home
      G29 ;Auto Bed-level
      G90 ;absolute positioning
      G1 X-10 Y-10 F3000 ;Move to corner
      M190 S[first_layer_bed_temperature] ;Wait For Bed Temperature
      M109 S[first_layer_temperature] ;Wait for Hotend Temperature
      G92 E0 ;Zero set extruder position
      G1 E3 F200 ;Feed filament to clear nozzle
      G92 E0 ;Zero set extruder position
    thumbnails: ''
    use_firmware_retraction: false
    use_relative_e_distances: false
    use_volumetric_e: false
    variable_layer_height: false
    z_offset: 0.0
    extruder_clearance_height: 25.0
    extruder_clearance_radius: 75.0
    default_print: 0.20mm GOOD @Infinity3D_DEV_200
