# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*Creality ENDER3*'
condition: printer.model == "ENDER3"
variants:
- condition: tool.nozzle_diameter == 0.3
  name: Creality Ender-3 (0.3 mm nozzle)
  id: JQqqtYkLVweWa2KQplAUgg
  values:
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      G92 E0
      ;{layer_z}

    between_objects_gcode: ''
    pause_print_gcode: ''
    extruder_offset:
    - '0x0'
    gcode_flavor: marlin
    silent_mode: false
    remaining_times: false
    machine_max_acceleration_e:
    - 5000.0
    machine_max_acceleration_extruding:
    - 500.0
    machine_max_acceleration_retracting:
    - 1000.0
    machine_max_acceleration_travel:
    - 500.0
    machine_max_acceleration_x:
    - 500.0
    machine_max_acceleration_y:
    - 500.0
    machine_max_acceleration_z:
    - 100.0
    machine_max_feedrate_e:
    - 60.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 10.0
    machine_max_jerk_e:
    - 5.0
    machine_max_jerk_x:
    - 8.0
    machine_max_jerk_y:
    - 8.0
    machine_max_jerk_z:
    - 0.4
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    machine_limits_usage: emit_to_gcode
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;{layer_z}
    max_print_height: 250.0
    single_extruder_multi_material: false
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 25.0
    extruder_clearance_radius: 55.0
    start_gcode: |-
      G90 ; use absolute coordinates
      M83 ; extruder relative mode
      M104 S{is_nil(idle_temperature[0]) ? 150 : idle_temperature[0]} ; set temporary nozzle temp to prevent oozing during homing
      M140 S{first_layer_bed_temperature[0]} ; set final bed temp
      G4 S30 ; allow partial nozzle warmup
      G28 ; home all axis
      G1 Z50 F240
      G1 X2.0 Y10 F3000
      M104 S{first_layer_temperature[0]} ; set final nozzle temp
      M190 S{first_layer_bed_temperature[0]} ; wait for bed temp to stabilize
      M109 S{first_layer_temperature[0]} ; wait for nozzle temp to stabilize
      G1 Z0.28 F240
      G92 E0
      G1 X2.0 Y140 E10 F1500 ; prime the nozzle
      G1 X2.3 Y140 F5000
      G92 E0
      G1 X2.3 Y10 E10 F1200 ; prime the nozzle
      G92 E0
    end_gcode: |-
      {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}
      G1 X5 Y{print_bed_max[1]*0.85} F{travel_speed*60} ; present print
      {if max_layer_z < max_print_height-10}G1 Z{z_offset+min(max_layer_z+70, max_print_height-10)} F600 ; Move print head further up{endif}
      {if max_layer_z < max_print_height*0.6}G1 Z{max_print_height*0.6} F600 ; Move print head further up{endif}
      M140 S0 ; turn off heatbed
      M104 S0 ; turn off temperature
      M107 ; turn off fan
      M84 X Y E ; disable motors
    bed_shape:
    - 3x3
    - 228x3
    - 228x228
    - 3x228
    default_print: 0.12 mm DETAIL (0.3 mm nozzle) @CREALITY
