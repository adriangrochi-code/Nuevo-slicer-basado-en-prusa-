# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*LNL3D LNL3D_D3*'
condition: printer.model == "LNL3D_D3"
variants:
- condition: tool.nozzle_diameter == 0.2
  name: LNL3D D3 (0.2 mm nozzle)
  id: uMsSm9JtW0uKUeb24ASVIw
  values:
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      G92 E0
      ;{layer_z}

    between_objects_gcode: ''
    pause_print_gcode: ''
    extruder_offset:
    - '0x0'
    - '0x0'
    gcode_flavor: marlin
    silent_mode: false
    remaining_times: false
    machine_max_acceleration_e:
    - 5000.0
    machine_max_acceleration_extruding:
    - 500.0
    machine_max_acceleration_retracting:
    - 1000.0
    machine_max_acceleration_travel:
    - 500.0
    machine_max_acceleration_x:
    - 500.0
    machine_max_acceleration_y:
    - 500.0
    machine_max_acceleration_z:
    - 100.0
    machine_max_feedrate_e:
    - 60.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 10.0
    machine_max_jerk_e:
    - 5.0
    machine_max_jerk_x:
    - 8.0
    machine_max_jerk_y:
    - 8.0
    machine_max_jerk_z:
    - 0.4
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    machine_limits_usage: time_estimate_only
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;{layer_z}
    single_extruder_multi_material: false
    toolchange_gcode: |-
      (if current extruder ==0}
      G1 F1800
      {if current_extruder ==1}
      G1 F1800
      {endif}
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 5.0
    extruder_clearance_radius: 36.0
    start_gcode: |
      G21                                        ; Metric values
      G90                                        ; Absolute positioning
      M82                                        ; Set extruder to absolute mode
      M107                                       ; Start with the fan off
      G28                                        ; Move to min endstops
      G92 E0                                     ; Reset extruder
      G1 Z15.0 F3000                             ; Move the header up 15mm
      M117 Final warmup                          ; LCD message
      M140 S[first_layer_bed_temperature]        ; Set bed temp
      M190 S{first_layer_bed_temperature[0] - 5} ; Wait for bed temp-5
      M104 S[first_layer_temperature]            ; Heat extruder rest of the way after heatbed
      M109 S[first_layer_temperature]            ; Wait for extruder temp
      G1 X40 Y5 Z4 F5000.0                       ; Move to position to prevent hitting clamps or bed
      G1 X50 Y5 Z0.3 F5000.0                     ; Move to start position
      G1 X110 Y5 Z0.3 F1500.0 E15                ; First purge line
      G1 X70 Y5 Z0.3 F1500.0 E8                  ; Second pass
      M117 Printing...                           ; LCD message
    end_gcode: |-
      M104 T0 S0                   ;left extruder heater off
      M104 T1 S0                   ;right extruder heater off
      M140 S0                      ;heated bed heater off (if you have it)
      G91                          ;relative positioning
      G1 E-1 F300                  ;retract the filament a bit before lifting the nozzle, to release some of the pressure
      G1 Z+0.5 E-5 X-20 Y-20 F9000 ;move Z up a bit and retract filament even more
      G28 X0 Y0                    ;move X/Y to min endstops, so the head is out of the way
      M84                          ;steppers off
      G90                          ;absolute positioning
    bed_shape:
    - '0x0'
    - 300x0
    - 300x300
    - '0x300'
    max_print_height: 350.0
    default_print: 0.12 mm DETAIL (0.2 mm nozzle) @LNL3D
