variants:
- condition: tool.nozzle_diameter == 0.4
  name: Anycubic i3 Mega S
  id: 7vyCem+iWsSjmGeXz2OaMA
  values:
    bed_shape:
    - '0x0'
    - 210x0
    - 210x210
    - '0x210'
    before_layer_gcode: |-
      ;BEFORE_LAYER_CHANGE
      G92 E0.0
      ;[layer_z]
    end_gcode: |-
      G1 E-1.0 F2100 ; retract
      G92 E0.0
      G1{if max_layer_z < max_print_height} Z{z_offset+min(max_layer_z+30, max_print_height)}{endif} E-34.0 F720 ; move print head up & retract filament
      G4 ; wait
      M104 S0 ; turn off temperature
      M140 S0 ; turn off heatbed
      M107 ; turn off fan
      G1 X0 Y105 F3000 ; park print head
      M84 ; disable motors
    gcode_flavor: marlin
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;[layer_z]
    max_print_height: 205.0
    remaining_times: true
    silent_mode: false
    start_gcode: |-
      G90 ; use absolute coordinates
      M83 ; extruder relative mode
      M204 S[machine_max_acceleration_extruding] T[machine_max_acceleration_retracting]
      M104 S[first_layer_temperature] ; set extruder temp
      M140 S[first_layer_bed_temperature] ; set bed temp
      G28 ; home all
      G1 Y1.0 Z0.3 F1000 ; move print head up
      M190 S[first_layer_bed_temperature] ; wait for bed temp
      M109 S[first_layer_temperature] ; wait for extruder temp
      G92 E0.0
      ; initial load
      G1 X205.0 E19 F1000
      G1 Y1.6
      G1 X5.0 E19 F1000
      G92 E0.0
      ; intro line
      G1 Y2.0 Z0.2 F1000
      G1 X65.0 E9.0 F1000
      G1 X105.0 E12.5 F1000
      G92 E0.0
    thumbnails: 16x16,220x124
    use_relative_e_distances: true
    machine_max_acceleration_e:
    - 10000.0
    machine_max_acceleration_extruding:
    - 1250.0
    machine_max_acceleration_retracting:
    - 1250.0
    machine_max_acceleration_x:
    - 3000.0
    machine_max_acceleration_y:
    - 2000.0
    machine_max_acceleration_z:
    - 60.0
    machine_max_feedrate_e:
    - 30.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 8.0
    machine_max_jerk_e:
    - 5.0
    machine_max_jerk_x:
    - 10.0
    machine_max_jerk_y:
    - 10.0
    machine_max_jerk_z:
    - 0.4
    extruder_clearance_height: 35.0
    extruder_clearance_radius: 60.0
    default_print: 0.15mm QUALITY @MEGA
