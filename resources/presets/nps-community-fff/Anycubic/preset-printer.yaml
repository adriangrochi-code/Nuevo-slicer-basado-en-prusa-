kind: printer
id: '*Anycubic MEGA0*'
condition: printer.model == "MEGA0"
variants:
- condition: tool.nozzle_diameter == 0.4
  name: Anycubic Mega Zero
  id: OVHyXMfTUoS7Z+HoTqk0yg
  values:
    bed_shape:
    - '0x0'
    - 220x0
    - 220x220
    - '0x220'
    before_layer_gcode: |-
      ; BEFORE_LAYER_CHANGE [layer_num] @ [layer_z]mm
      G92 E0
    between_objects_gcode: ''
    extruder_offset:
    - '0x0'
    gcode_flavor: marlin
    silent_mode: false
    remaining_times: false
    machine_max_acceleration_e:
    - 5000.0
    machine_max_acceleration_extruding:
    - 500.0
    machine_max_acceleration_retracting:
    - 500.0
    machine_max_acceleration_x:
    - 500.0
    machine_max_acceleration_y:
    - 500.0
    machine_max_acceleration_z:
    - 100.0
    machine_max_feedrate_e:
    - 25.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 5.0
    machine_max_jerk_e:
    - 5.0
    machine_max_jerk_x:
    - 10.0
    machine_max_jerk_y:
    - 10.0
    machine_max_jerk_z:
    - 0.4
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    layer_gcode: ; AFTER_LAYER_CHANGE [layer_num] @ [layer_z]mm
    max_print_height: 250.0
    single_extruder_multi_material: false
    start_gcode: |
      G21 ;metric values
      G90 ;absolute positioning
      M82 ;set extruder to absolute mode
      M107 ;start with the fan off
      M117 Homing X/Y ...
      G28 X0 Y0 ;move X/Y to min endstops
      M117 Homing Z ...
      G28 Z0 ;move Z to min endstops
      G1 Z15.0 F240 ;move the platform down 15mm
      M117 Heating ...
      M104 S[first_layer_temperature]
       ; set extruder temp
      M109 S[first_layer_temperature]
       ; wait for extruder temp
      M117 Start cleaning ...
      G92 E0 ;zero the extruded length
      G1 F200 E10 ;extrude 10mm of feed stock
      G92 E0 ;zero the extruded length again
      M117 Intro line ...
      G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
      G1 X0.1 Y20 Z[first_layer_height] F5000.0 ; Move to start position
      G1 X0.1 Y200.0 Z[first_layer_height] F1500.0 E15 ; Draw the first line
      G1 X0.4 Y200.0 Z[first_layer_height] F5000.0 ; Move to side a little
      G1 X0.4 Y20 Z0.3[first_layer_height] F1500.0 E30 ; Draw the second line
      G92 E0 ; Reset Extruder
      G1 E-1 F500 ; Retract filiment by 1 mm
      G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
      G1 X5 Y20 Z0.3 F240 ; Move over to prevent blob squish
      G92 E0 ; Reset Extruder
      M117 Printing...
    end_gcode: |
      M117 Cooling down...
      M104 S0 ; turn off extruder
      M107 ; Fan off
      M84 ; disable motors
      G91 ;relative positioning
      G1 E-1 F300 ;retract the filament a bit before lifting the nozzle, to release some of the pressure
      G1 Z+0.5 E-5 ;X-20 Y-20 F240 ;move Z up a bit and retract filament even more
      G28 X0 ;move X to min endstops, so the head is out of the way
      G90 ;Absolute positionning
      G1 Y200 F3000 ;Present print
      M84 ;steppers off
      M300 P300 S4000
      M117 Finished.
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    extruder_clearance_height: 25.0
    extruder_clearance_radius: 45.0
    default_print: 0.20mm NORMAL @MEGA0
