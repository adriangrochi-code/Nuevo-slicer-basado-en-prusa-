# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*Trimaker Trimaker Nebula Cloud*'
condition: printer.model == "Trimaker Nebula Cloud"
variants:
- condition: tool.nozzle_diameter == 0.4
  name: Trimaker Nebula Cloud 0.4 nozzle
  id: LwvD0pxYUxK6c1JWW4H6Lg
  values:
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      G92 E0.0
      ;[layer_z]

    between_objects_gcode: ''
    extruder_offset:
    - '0x0'
    gcode_flavor: marlin2
    silent_mode: false
    remaining_times: false
    machine_max_acceleration_e:
    - 5000.0
    - 5000.0
    machine_max_acceleration_extruding:
    - 1250.0
    - 12500.0
    machine_max_acceleration_retracting:
    - 1250.0
    - 1250.0
    machine_max_acceleration_x:
    - 2500.0
    - 2500.0
    machine_max_acceleration_y:
    - 2500.0
    - 2500.0
    machine_max_acceleration_z:
    - 200.0
    - 200.0
    machine_max_feedrate_e:
    - 120.0
    - 120.0
    machine_max_feedrate_x:
    - 250.0
    machine_max_feedrate_y:
    - 250.0
    machine_max_feedrate_z:
    - 12.0
    - 12.0
    machine_max_jerk_e:
    - 4.5
    - 4.5
    machine_max_jerk_x:
    - 20.0
    machine_max_jerk_y:
    - 20.0
    machine_max_jerk_z:
    - 0.4
    - 0.4
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;[layer_z]
    single_extruder_multi_material: false
    start_gcode: |-
      G90 ; use absolute coordinates
      M83 ; extruder relative mode
      M104 S[first_layer_temperature] ; set extruder temp
      M140 S[first_layer_bed_temperature] ; set bed temp
      M190 S[first_layer_bed_temperature] ; wait for bed temp
      M109 S[first_layer_temperature] ; wait for extruder temp
      G28 ; home all
      G92 E0.0
      G29 ; bed leveling
      M500
      G1 F3000 X0.5 Y0.5
      G1 F2000 Z0.300
      G1 F900 X0.5 Y51.5 E2.56436 ; intro line
      G92 E0.0
    end_gcode: |
      ;printing object ENDGCODE
       M107; Apagamos fan
       G90
       G92 E0
       G1 X200 Y200
       G91
       G1 Z5
       G92 E0
       M140 S0; Enfriamos
       M104 S0; Enfriamos
       M84
       G90
       M117 Impresion finalizada
       M300 S440 P700
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    cooling_tube_length: 5.0
    cooling_tube_retraction: 91.5
    extruder_clearance_height: 25.0
    extruder_clearance_radius: 45.0
    bed_shape:
    - '0x0'
    - 230x0
    - 230x230
    - '0x230'
    max_print_height: 260.0
    default_print: 0.2 Layer - 0
