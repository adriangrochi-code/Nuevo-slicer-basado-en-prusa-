# Generado por tools/presets/convert.py: no editar a mano.
kind: printer
id: '*CocoaPress Cocoa_Press*'
condition: printer.model == "Cocoa_Press"
variants:
- condition: tool.nozzle_diameter == 0.8
  name: Cocoa Press｜0.8mm
  id: ncz4DBZwWlqXiN/gX1sAUw
  values:
    gcode_flavor: marlin2
    extruder_clearance_height: 60.0
    extruder_clearance_radius: 65.0
    autoemit_temperature_commands: false
    bed_shape:
    - '0x0'
    - 140x0
    - 140x150
    - '0x150'
    before_layer_gcode: |+
      ;BEFORE_LAYER_CHANGE
      ;[layer_z]
      G92 E0

    between_objects_gcode: ''
    color_change_gcode: ";BEFORE_COLOR_CHANGE\n\nM83; use relative extrusion for extruder.\nG1 E-.2 F400 ;minor retraction to keep ooze contained.\n\nG60; save position\n\n;move the bed down 10mm\nG91; set to relative positioning\nG0 Z10;\nG90;\nM83; extruder relative motion.\n\nG0 X70 Y5; move to front for user to swap core.\nM17; enable steppers so that the user can change cores without having the extruder or bed slip or move as easily.\n\nM0 Perform core swap now. Press OK when loaded.;\n\n; pause message, lazy edition.\nM117 Preheating core. (waiting 15m);\nG4 S60; pause delay so it's on screen\nM117 Preheating core. (waiting 14m);\nG4 S60; pause delay so it's on screen\nM117 Preheating core. (waiting 13m);\nG4 S60; pause delay so it's on screen\nM117 Preheating core. (waiting 12m);\nG4 S60; pause delay so it's on screen\nM117 Preheating core. (waiting 11m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 10m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 9m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 8m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 7m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 6m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 5m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 4m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 3m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 2m);\nG4 S60; pause delay so it's on screen \nM117 Preheating core. (waiting 1m);\nG4 S60; pause delay so it's on screen \nM0 Press \"OK\" to continue print. Have the spatula ready.;\n\n;move the bed up 10mm\nG91; set to relative positioning\nG0 Z10;\nG90;\nM83; extruder relative motion.\n\nG1 E.06 F900 ;extrude a lil bit.\nG92 E0 ; set extruder pos to zero\n\n; restore position\nG61; \n\n;AFTER_COLOR_CHANGE"
    cooling_tube_length: 5.0
    cooling_tube_retraction: 91.5
    end_gcode: |-
      print_end    ;end script from macro
      G91 ; set to relative
      G0 Z15; ; move 15mm down
      G90 ; absolute positioning again
      G0 X70 Y135
      M84
    extra_loading_move: -2.0
    extruder_offset:
    - '0x0'
    high_current_on_filament_swap: false
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;[layer_z]
    machine_limits_usage: time_estimate_only
    machine_max_acceleration_e:
    - 1500.0
    machine_max_acceleration_extruding:
    - 1500.0
    machine_max_acceleration_retracting:
    - 1500.0
    machine_max_acceleration_travel:
    - 1500.0
    - 1250.0
    machine_max_acceleration_x:
    - 1500.0
    machine_max_acceleration_y:
    - 1500.0
    machine_max_acceleration_z:
    - 500.0
    machine_max_feedrate_e:
    - 120.0
    machine_max_feedrate_x:
    - 500.0
    machine_max_feedrate_y:
    - 500.0
    machine_max_feedrate_z:
    - 12.0
    machine_max_jerk_e:
    - 2.5
    machine_max_jerk_x:
    - 10.0
    machine_max_jerk_y:
    - 10.0
    machine_max_jerk_z:
    - 0.2
    machine_min_extruding_rate:
    - 0.0
    machine_min_travel_rate:
    - 0.0
    max_print_height: 150.0
    parking_pos_retraction: 92.0
    pause_print_gcode: |
      ; Start Pause Print
      ; This pause GCode is changed in PrusaSlicer via the Print Settings -> Output Options -> G-Code Substititons
      ; This is due to how PrusaSlicer inserts the M117 message for pause at the start of any custom GCode in this
      ; box.  As such, to soft-park the toolhead, handle retractions, and more, this is done in custom G-Code inj-
      ; -ected before this message.  Furthering this, due to a bug in how Marlin handles M117 messages on our di-
      ; -splay, we use M0 instead, hence the use of the second G-Code substitution regex.
      ; Thank you for understanding.


      G90; Set absolute coordinate moves
      M83; set extruder relative.
      G61 F15000 XY ; move to last XY position.
      M400; wait for move to finish.
      G4 P100; small delay (100ms) to get around desync issues.

      G1 E.6 F300; Purge small amount of Cocoa Core via extruder after pause.

      G61 F15000 Z; move to last Z position (10mm offset, probably)
      M400; wait for move to finish.
      G4 P100; small delay (100ms) to get around desync issues.

      G92 E0; Set extruder to "zero" so that it's not remembered.
      G1 E.00001 900; very small move to reset feedrate bug.
    remaining_times: false
    silent_mode: false
    single_extruder_multi_material: false
    start_gcode: |-
      M220 S100; set speed to 100%
      G21 ; set units to millimeters
      G90 ; use absolute coordinates
      M83 ; use relative distances for extrusion

      G28; home all axes
      M420 S1; turn back on mesh leveling
      G92 E0 ; set extruder pos to zero

      ; homing + loading mesh
      G29 O V4 ; try to probe mesh, but skip if already done.

      G1 Z1.5 F4500

      ; Purge Line 1

      G1 X131.75 Y148 Z3.2
      G1 X128.625 Y148 Z.5 E.15
      G1 X8.25 Y148 E.25 F900

      ; Purge Line 2

      G1 X8.25 Y145 F900
      G1 X131.25 Y145 E.10538
      G1 X141.75 Y145
    template_custom_gcode: ''
    thumbnails: 64x64,400x300
    toolchange_gcode: ''
    use_firmware_retraction: false
    use_relative_e_distances: true
    use_volumetric_e: false
    variable_layer_height: true
    z_offset: 0.0
    default_print: '0.5'
