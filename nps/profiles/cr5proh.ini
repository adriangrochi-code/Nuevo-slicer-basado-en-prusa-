# Creality CR-5 Pro H — perfil base para NPS (PrusaSlicer).
# Punto de partida conservador: ajusta temperaturas a tu filamento y calibra
# e-steps, flujo y retracción antes de probar capas no planas.

# --- Impresora ---
printer_technology = FFF
gcode_flavor = marlin2
bed_shape = 0x0,300x0,300x225,0x225
max_print_height = 380
nozzle_diameter = 0.4
# Límites de firmware que se envían a la impresora (M201/M203) y que NPS usa para
# su limitador de Z. Si cambias los de Z, cambia también --z-max-speed / --z-max-accel.
machine_limits_usage = emit_to_gcode
machine_max_feedrate_x = 300,300
machine_max_feedrate_y = 300,300
machine_max_feedrate_z = 10,10
machine_max_feedrate_e = 60,60
machine_max_acceleration_x = 1000,1000
machine_max_acceleration_y = 1000,1000
machine_max_acceleration_z = 250,250
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 1000,1000
machine_max_acceleration_retracting = 1000,1000
machine_max_jerk_x = 8,8
machine_max_jerk_y = 8,8
machine_max_jerk_z = 0.4,0.4
machine_max_jerk_e = 5,5

# Extrusor Bowden: retracción larga
retract_length = 5
retract_speed = 40
deretract_speed = 30
retract_before_travel = 1.5
retract_lift = 0.6
travel_speed_z = 10

start_gcode = M140 S[first_layer_bed_temperature]\nM104 S150 ; precalentar sin rezumar\nG90\nM83\nG28\nM420 S1 Z10 ; malla del BL-Touch guardada (o cámbialo por G29)\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 Z2 F600\nG1 X5 Y20 Z0.3 F3000\nG1 X5 Y200 E15 F1500 ; línea de purga\nG1 X5.4 Y200 F3000\nG1 X5.4 Y20 E15 F1500\nG1 Z2 F600
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0
end_gcode = G91\nG1 E-3 F2400\nG1 Z10 F600\nG90\nG1 X0 Y220 F3000\nM104 S0\nM140 S0\nM107\nM84

# --- Filamento (PLA) ---
filament_diameter = 1.75
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 65
# Hotend Creality estándar: ~10 mm³/s es un límite realista para PLA
max_volumetric_speed = 10
cooling = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1

# --- Impresión ---
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid
perimeter_speed = 50
external_perimeter_speed = 35
infill_speed = 80
solid_infill_speed = 60
top_solid_infill_speed = 40
gap_fill_speed = 30
travel_speed = 150
first_layer_speed = 25
skirts = 1
skirt_distance = 4
