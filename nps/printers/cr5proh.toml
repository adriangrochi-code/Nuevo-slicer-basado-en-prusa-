# Creality CR-5 Pro H: Bowden, BL-Touch, firmware de serie (M503: M203 Z5, M201 Z100).
[printer]
name = "Creality CR-5 Pro H"
bed_size = [300.0, 225.0]
max_height = 380.0
flavor = "marlin2"
max_speed = 100.0
max_flow = 10.0
z_max_speed = 5.0
z_max_accel = 100.0
retract_length = 5.0          # Bowden
retract_speed = 40.0
start_gcode = """
M140 S[first_layer_bed_temperature]
M104 S150 ; precalentar sin rezumar
G90
M83
G28
M420 S1 Z10 ; malla del BL-Touch guardada (o cámbialo por G29)
M190 S[first_layer_bed_temperature]
M109 S[first_layer_temperature]
G1 Z2 F600
G1 X5 Y20 Z0.3 F3000
G1 X5 Y200 E15 F1500 ; línea de purga
G1 X5.4 Y200 F3000
G1 X5.4 Y20 E15 F1500
G1 Z2 F600"""
end_gcode = """
G91
G1 E-3 F2400
G1 Z10 F600
G90
G1 X0 Y220 F3000
M104 S0
M140 S0
M107
M84"""

[material]
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 65

[print]
first_layer_height = 0.25
speed = 50.0

[nonplanar]
# Z por husillo lento: ondas largas y bajas
amplitude = 0.5
wavelength = 20.0
