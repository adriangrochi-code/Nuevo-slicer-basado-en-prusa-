# Impresora cartesiana genérica con Marlin (cama de 220 x 220).
# Copia este fichero, ajusta [printer] a tu máquina y úsalo con -c.
[printer]
name = "Genérica Marlin 220"
bed_size = [220.0, 220.0]
max_height = 250.0
flavor = "marlin2"
max_speed = 150.0
max_flow = 12.0
# Límites de Z del firmware (consúltalos con M503): ponlos para que NPS los respete.
z_max_speed = 5.0
z_max_accel = 100.0
