name: Build windows

# Builds the Windows binaries (prusa-slicer.exe) with MSVC and uploads them as a zip artifact:
# Actions > the run > Artifacts > TismaSlicer-windows.
# The dependencies are built from deps/ and cached, so only the first run is slow (~2-3 h).

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  # Queue instead of cancelling, so that a running build finishes and caches the dependencies.
  cancel-in-progress: false

jobs:
  build_win:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # Short paths: the dependency builds hit the Windows path length limit otherwise.
      DEPS_BUILD: C:/d
      DEPS_DEST: C:/dd
      APP_BUILD: C:/b
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/dd
          key: deps-win-msvc2022-${{ hashFiles('deps/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake -S deps -B %DEPS_BUILD% -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DDESTDIR=%DEPS_DEST% || exit /b 1
          cmake --build %DEPS_BUILD% --config Release -- /m /v:minimal || exit /b 1

      # Saved right away, so a failure of the application build does not lose them.
      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/dd
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Compiler cache in the GitHub Actions cache: a small change compiles in minutes instead of ~55 min.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Ninja + MSVC from the developer command prompt, so that every object file goes through sccache
      # (sccache needs /Z7 and no precompiled headers; /MP is useless with Ninja).
      - name: Configure
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B %APP_BUILD% -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%DEPS_DEST%/usr/local -DBUILD_TESTING=OFF -DSLIC3R_GUI=ON ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DSLIC3R_PCH=OFF -DSLIC3R_MSVC_COMPILE_PARALLEL=OFF -DTISMA_MSVC_EMBEDDED_DEBUG_INFO=ON || exit /b 1

      - name: Build
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --build %APP_BUILD% --target PrusaSlicer_app_gui PrusaSlicer_app_console PrusaSlicer_app_gcodeviewer OCCTWrapper || exit /b 1
          sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $out = "TismaSlicer"
          New-Item -ItemType Directory -Force $out | Out-Null
          # Ninja (single configuration) puts the binaries in src/, Visual Studio in src/Release/.
          $bin = @("$env:APP_BUILD/src/Release", "$env:APP_BUILD/src") | Where-Object { Test-Path "$_/prusa-slicer.exe" } | Select-Object -First 1
          if (-not $bin) { throw "prusa-slicer.exe not found" }
          Get-ChildItem $bin -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination $out
          # The STEP import (and the CAD retessellation) loads OCCTWrapper.dll next to the executable.
          $occt = @("$env:APP_BUILD/src/Release/OCCTWrapper.dll", "$env:APP_BUILD/src/OCCTWrapper.dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $occt) { throw "OCCTWrapper.dll not found" }
          Copy-Item $occt -Destination $out -Force
          Copy-Item -Recurse resources "$out/resources"
          Copy-Item doc/NonPlanarSlicer.md "$out/LEEME.md"
          Get-ChildItem $out
          & "$out/prusa-slicer-console.exe" --help | Select-Object -First 3

      - uses: actions/upload-artifact@v4
        with:
          name: TismaSlicer-windows
          path: TismaSlicer
          retention-days: 30
