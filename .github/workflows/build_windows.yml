name: Build windows

# Builds the Windows binaries (prusa-slicer.exe) with MSVC and uploads them as a zip artifact:
# Actions > the run > Artifacts > TismaSlicer-windows.
# The dependencies are built from deps/ and cached, so only the first run is slow (~2-3 h).

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  # Queue instead of cancelling, so that a running build finishes and caches the dependencies.
  cancel-in-progress: false

jobs:
  build_win:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # Short paths: the dependency builds hit the Windows path length limit otherwise.
      DEPS_BUILD: C:/d
      DEPS_DEST: C:/dd
      APP_BUILD: C:/b
      # Code signing (optional): a PFX code signing certificate in base64 and its password, as repository secrets.
      # Without them the binaries and the installer are not signed. See packaging/windows/README.md.
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      # Or SignPath Foundation (free for open source): API token secret and organization id variable, see
      # packaging/windows/README.md. Only the runs of the main branch and tags are signed (signing policy).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/dd
          key: deps-win-msvc2022-${{ hashFiles('deps/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake -S deps -B %DEPS_BUILD% -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DDESTDIR=%DEPS_DEST% || exit /b 1
          cmake --build %DEPS_BUILD% --config Release -- /m /v:minimal || exit /b 1

      # Saved right away, so a failure of the application build does not lose them.
      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/dd
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # TODO (after the first test on Windows): Ninja + sccache (see commit 4a4a936) for incremental builds.
      - name: Configure
        shell: cmd
        run: |
          rem Release only, as build_win.bat does: with Debug among the configurations, FindOpenVDB also
          rem requires the debug libraries, which are not built (DEP_DEBUG=OFF).
          cmake -S . -B %APP_BUILD% -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=%DEPS_DEST%/usr/local -DCMAKE_CONFIGURATION_TYPES=Release -DBUILD_TESTING=OFF -DSLIC3R_GUI=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build %APP_BUILD% --config Release --target PrusaSlicer_app_gui PrusaSlicer_app_console PrusaSlicer_app_gcodeviewer OCCTWrapper -- /m /v:minimal

      - name: Package
        shell: pwsh
        run: |
          $out = "TismaSlicer"
          New-Item -ItemType Directory -Force $out | Out-Null
          # Ninja (single configuration) puts the binaries in src/, Visual Studio in src/Release/.
          $bin = @("$env:APP_BUILD/src/Release", "$env:APP_BUILD/src") | Where-Object { Test-Path "$_/prusa-slicer.exe" } | Select-Object -First 1
          if (-not $bin) { throw "prusa-slicer.exe not found" }
          Get-ChildItem $bin -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination $out
          # The STEP import (and the CAD retessellation) loads OCCTWrapper.dll next to the executable.
          $occt = @("$env:APP_BUILD/src/Release/OCCTWrapper.dll", "$env:APP_BUILD/src/OCCTWrapper.dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $occt) { throw "OCCTWrapper.dll not found" }
          Copy-Item $occt -Destination $out -Force
          # PrusaSlicer.dll needs GMP and MPFR (CGAL); upstream copies them with the PrusaSlicerDllsCopy target,
          # which is not among the built targets. Without them prusa-slicer.exe exits silently.
          Copy-Item deps/+GMP/gmp/lib/win64/libgmp-10.dll, deps/+MPFR/mpfr/lib/win64/libmpfr-4.dll -Destination $out
          # Visual C++ runtime next to the executable (app-local deployment of the redistributable files), so a PC
          # without the Visual C++ Redistributable can run it too.
          $crt = Get-ChildItem "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ runtime not found" }
          Copy-Item "$($crt.FullName)/*.dll" -Destination $out
          Copy-Item -Recurse resources "$out/resources"
          Copy-Item doc/NonPlanarSlicer.md "$out/LEEME.md"
          Get-ChildItem $out
          # Smoke test: PrusaSlicer.dll must load (it prints the usage), otherwise the package is broken.
          $help = & "$out/prusa-slicer-console.exe" --help 2>&1 | Out-String
          if ($help -notmatch "Usage:") { Write-Output $help; throw "prusa-slicer-console.exe did not start (PrusaSlicer.dll not loaded?)" }
          Write-Output ($help -split "`n" | Select-Object -First 4)

      - name: Sign binaries
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          # Only our own binaries (the runtime and the third party DLLs keep their own signatures).
          $files = Get-ChildItem TismaSlicer -File | Where-Object { $_.Name -match '^(prusa-.*\.exe|PrusaSlicer.*\.dll|OCCTWrapper\.dll)$' }
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $files.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx

      - uses: actions/upload-artifact@v4
        id: upload-package
        with:
          name: TismaSlicer-windows
          path: TismaSlicer
          retention-days: 30

      # SignPath signs the executables and our DLLs inside the package (artifact configuration "package") and returns it;
      # the installer is then built from the signed files.
      - name: Sign package (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tisma-slicer
          signing-policy-slug: release-signing
          artifact-configuration-slug: package
          github-artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: TismaSlicer

      - uses: actions/upload-artifact@v4
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        with:
          name: TismaSlicer-windows
          path: TismaSlicer
          retention-days: 30
          overwrite: true

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed" }
          $iscc = "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          $version = (Select-String -Path version.inc -Pattern 'set\(SLIC3R_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force installer | Out-Null
          & $iscc "/DSourceDir=$PWD/TismaSlicer" "/DAppVersion=$version" "/DBuildNumber=${{ github.run_number }}" "/DOutputDir=$PWD/installer" packaging/windows/TismaSlicer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $setup = Get-ChildItem installer/*.exe | Select-Object -First 1
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setup.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            Remove-Item $pfx
          }
          Get-ChildItem installer

      - uses: actions/upload-artifact@v4
        id: upload-installer
        with:
          name: TismaSlicer-windows-installer
          path: installer
          retention-days: 30

      - name: Sign installer (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tisma-slicer
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer

      - uses: actions/upload-artifact@v4
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        with:
          name: TismaSlicer-windows-installer
          path: installer
          retention-days: 30
          overwrite: true

      - name: Test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/*.exe | Select-Object -First 1
          # Smoke test: silent installation for the current user, the installed program starts, silent uninstallation.
          $dir = Join-Path $env:RUNNER_TEMP "tisma-install"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir", "/TASKS=assocmodels" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer failed ($($p.ExitCode))" }
          $help = & "$dir/prusa-slicer-console.exe" --help 2>&1 | Out-String
          if ($help -notmatch "Usage:") { Write-Output $help; throw "The installed program did not start" }
          $p = Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller failed ($($p.ExitCode))" }
          # The signature, when signed.
          Get-AuthenticodeSignature $setup.FullName | Format-List Status, SignerCertificate
