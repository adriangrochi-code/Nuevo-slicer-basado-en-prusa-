name: Cloud server

# Tests of the Tisma Cloud server (server/, proprietary, Python) on SQLite and PostgreSQL.

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tisma
          POSTGRES_PASSWORD: tisma
          POSTGRES_DB: tisma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tisma" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[master,test]"
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TISMA_TEST_DATABASE_URL: postgresql+psycopg://tisma:tisma@localhost:5432/tisma_test
        run: pytest -q
