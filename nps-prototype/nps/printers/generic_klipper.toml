# Impresora genérica con Klipper (CoreXY 300 x 300). Requiere las macros
# PRINT_START / PRINT_END en printer.cfg.
[printer]
name = "Genérica Klipper 300"
bed_size = [300.0, 300.0]
max_height = 300.0
flavor = "klipper"
max_speed = 300.0
max_flow = 20.0
# max_z_velocity / max_z_accel de printer.cfg
z_max_speed = 15.0
z_max_accel = 350.0
retract_length = 0.5
retract_speed = 40.0

[print]
speed = 120.0
